<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .badge-weights { font-size: 11px; font-weight: 600; fill: #1e40af; }
      .badge-context { font-size: 11px; font-weight: 600; fill: #15803d; }
      .item-label { font-size: 12px; font-weight: 600; fill: #334155; }
      .item-desc { font-size: 11.5px; font-weight: 400; fill: #475569; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">参数记忆（Weights）与工作记忆（Context Window）的物理本质</text>
  <text x="36" y="68" class="subtitle">瞬时上下文工作台 vs 预训练固化权重</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Column: 参数记忆 -->
  <g transform="translate(36, 116)">
    <rect width="430" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="116" height="24" rx="4" fill="#e2e8f0"/>
    <text x="74" y="32" text-anchor="middle" class="badge-weights">物理实体：权重文件</text>
    <text x="142" y="34" class="col-title">参数记忆（Parametric Memory）</text>

    <!-- Content Rows -->
    <g transform="translate(16, 54)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="22" class="item-label">存储载体：静态显存浮点张量</text>
      <text x="14" y="40" class="item-desc">预训练后参数固化，推理时不写入</text>
    </g>

    <g transform="translate(16, 112)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="22" class="item-label">生命周期：永久固化（只读）</text>
      <text x="14" y="40" class="item-desc">关机、刷新会话、并发调用时始终保持一致，通用不灭</text>
    </g>

    <g transform="translate(16, 170)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="22" class="item-label">本质局限：知识冻结与幻觉</text>
      <text x="14" y="40" class="item-desc">无法实时记住用户个人信息，缺乏物理真伪校验回路</text>
    </g>
  </g>

  <!-- Right Column: 工作记忆 -->
  <g transform="translate(494, 116)">
    <rect width="430" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="124" height="24" rx="4" fill="#dcfce7"/>
    <text x="78" y="32" text-anchor="middle" class="badge-context">物理实体：KV Cache</text>
    <text x="150" y="34" class="col-title">工作记忆（Working Context）</text>

    <!-- Content Rows -->
    <g transform="translate(16, 54)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="22" class="item-label" fill="#15803d">承载方式：单次推理中动态生成的激活值</text>
      <text x="14" y="40" class="item-desc">由输入 Prompt 驱动，临时驻留在 GPU 高速显存（HBM）中</text>
    </g>

    <g transform="translate(16, 112)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="22" class="item-label" fill="#15803d">生命周期：瞬时计算（随算随销）</text>
      <text x="14" y="40" class="item-desc">单次 HTTP 请求结束即释放显存；开启新会话即物理归零</text>
    </g>

    <g transform="translate(16, 170)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="22" class="item-label" fill="#15803d">核心价值：即时上下文对齐（In-Context Learning）</text>
      <text x="14" y="40" class="item-desc">注入外部文档、约束规范与当前意图，但容量严格受限</text>
    </g>
  </g>
</svg>
