<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .stage-title { font-size: 13px; font-weight: 700; }
      .stage-desc { font-size: 10.5px; font-weight: 400; fill: #64748b; }
      .tag { font-size: 10px; font-weight: 600; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    </style>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">提示词（Prompt）通过自注意力收拢生成轨道的物理链路</text>
  <text x="36" y="68" class="subtitle">提示词是输入 Token 序列，通过 KV 激活矩阵对全词表概率分布施加强力几何偏置</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Pipeline (4 Stages) -->
  <g transform="translate(36, 114)">
    <!-- Stage 1: Natural Prompt -->
    <g transform="translate(0, 0)">
      <rect width="195" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="12" y="12" width="60" height="20" rx="3" fill="#e2e8f0"/>
      <text x="42" y="26" text-anchor="middle" class="tag" fill="#475569">输入端</text>
      <text x="12" y="52" class="stage-title" fill="#0f172a">自然语言提示词</text>
      <line x1="12" y1="68" x2="183" y2="68" stroke="#e2e8f0" stroke-width="1"/>

      <rect x="12" y="80" width="171" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="100" font-size="11px" font-weight="600" fill="#1e40af">「请只输出 JSON」</text>
      <text x="20" y="118" font-size="10px" fill="#64748b">人类可读的指令文本</text>

      <text x="12" y="152" class="stage-desc">在应用层只是普通字符串，</text>
      <text x="12" y="170" class="stage-desc">等待送入分词器转换</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 200 118 L 222 118" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

    <!-- Stage 2: Tokenization & Embedding -->
    <g transform="translate(228, 0)">
      <rect width="200" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#dbeafe"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#1d4ed8">Token 编码</text>
      <text x="12" y="52" class="stage-title" fill="#1e40af">离散编号与高维向量</text>
      <line x1="12" y1="68" x2="188" y2="68" stroke="#bfdbfe" stroke-width="1"/>

      <rect x="12" y="80" width="176" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="20" y="100" class="mono" fill="#1e40af">[1204, 382, 4920, 184]</text>
      <text x="20" y="118" font-size="10px" fill="#3b82f6">查表生成稠密 Embedding</text>

      <text x="12" y="152" class="stage-desc" fill="#1e40af">变成 GPU 显存中的浮点张量，</text>
      <text x="12" y="170" class="stage-desc" fill="#1e40af">准备参与多头注意力矩阵乘法</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 433 118 L 455 118" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

    <!-- Stage 3: Self-Attention KV Cache -->
    <g transform="translate(461, 0)">
      <rect width="200" height="236" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#fef9c3"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#a16207">注意力施加</text>
      <text x="12" y="52" class="stage-title" fill="#854d0e">KV 激活矩阵偏置</text>
      <line x1="12" y1="68" x2="188" y2="68" stroke="#fde047" stroke-width="1"/>

      <rect x="12" y="80" width="176" height="50" rx="4" fill="#ffffff" stroke="#fde047"/>
      <text x="20" y="100" class="mono" fill="#854d0e">K = X·W_K, V = X·W_V</text>
      <text x="20" y="118" font-size="10px" fill="#a16207">常驻显存对当前 Query 打分</text>

      <text x="12" y="152" class="stage-desc" fill="#854d0e">注意力权重拉扯高维隐空间，</text>
      <text x="12" y="170" class="stage-desc" fill="#854d0e">将生成导向 JSON 语法特征区</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 666 118 L 688 118" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

    <!-- Stage 4: Probability Collapsing -->
    <g transform="translate(694, 0)">
      <rect width="194" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="3" fill="#dcfce7"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#15803d">轨道收拢</text>
      <text x="12" y="52" class="stage-title" fill="#166534">词表概率高度聚集</text>
      <line x1="12" y1="68" x2="182" y2="68" stroke="#86efac" stroke-width="1"/>

      <rect x="12" y="80" width="170" height="50" rx="4" fill="#ffffff" stroke="#86efac"/>
      <text x="20" y="100" font-size="11px" font-weight="700" fill="#15803d">P("{" ) = 94.2%</text>
      <text x="20" y="118" font-size="10px" fill="#16a34a">P("好的" ) 压低至 0.1%</text>

      <text x="12" y="152" class="stage-desc" fill="#14532d">提示词完成了概率轨道的锁定，</text>
      <text x="12" y="170" class="stage-desc" fill="#14532d">下一个 Token 必然吐出目标字符</text>
    </g>
  </g>

  <!-- Bottom Tip Banner -->
  <g transform="translate(36, 368)">
    <rect width="888" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="21" font-size="11.5px" fill="#475569">💡 提示词不是人脑意识沟通，而是通过自注意力点积施加向量牵引力，将词表概率强行压进期望的轨道。</text>
  </g>
</svg>
