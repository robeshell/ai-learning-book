<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">GraphRAG 知识图谱拓扑与分层社区摘要机制</text>
  <text x="36" y="68" class="subtitle">实体关系图谱与 Leiden 分层社区全局检索</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Naive Chunking Limitation (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="100" height="22" rx="4" fill="#fee2e2"/>
      <text x="66" y="29" text-anchor="middle" class="tag" fill="#dc2626">朴素切块局限</text>
      <text x="126" y="30" class="col-title" fill="#991b1b">文档碎片化与全局盲区</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">孤立切块导致的关系切断：</text>
        <text x="12" y="38" class="mono" fill="#7f1d1d">• Chunk 1: 李总成立阿尔法公司</text>
        <text x="12" y="54" class="mono" fill="#7f1d1d">• Chunk 2: 部门收购贝塔科技</text>
        <text x="12" y="72" class="box-desc" fill="#991b1b">➔ 提问宏观脉络时，局部向量检索失效</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">核心缺陷：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 仅支持局部点状检索</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 无法跨文档串联多跳关系</text>
      </g>
    </g>

    <!-- Right: GraphRAG Topology & Summary (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="16" y="14" width="100" height="22" rx="4" fill="#dcfce7"/>
      <text x="66" y="29" text-anchor="middle" class="tag" fill="#16a34a">GraphRAG 架构</text>
      <text x="126" y="30" class="col-title" fill="#166534">图谱网络与分层社区摘要</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="20" class="box-label" fill="#166534">实体-关系网络抽取与聚类：</text>
        <text x="12" y="38" class="mono" fill="#14532d">• 抽取 [实体: 李总] ➔ [创立] ➔ [阿尔法] ➔ [收购] ➔ [贝塔]</text>
        <text x="12" y="54" class="mono" fill="#14532d">• Leiden 算法自动发现紧密关联的高阶「社区」</text>
        <text x="12" y="72" class="mono-bold" fill="#15803d">➔ 自底向上为每个社区生成结构化 Report 摘要</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">双模式全局检索（Global Search）：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 并行召回社区摘要并汇总</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 兼顾宏观概括与微观事实溯源</text>
      </g>
    </g>

  </g>
</svg>
