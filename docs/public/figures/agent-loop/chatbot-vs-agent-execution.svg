<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Chatbot 聊天机器人 vs AI Agent 智能体执行流对比</text>
  <text x="36" y="68" class="subtitle">Chatbot 停留在单次被动生成建议；Agent 自主分解动作、执行工具、看反馈并持续自愈直到交付结果</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Chatbot (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#e2e8f0"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#475569">单次被动应答</text>
      <text x="136" y="30" class="col-title" fill="#0f172a">Chatbot（嘴上给建议）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="20" class="box-label" fill="#0f172a">用户指令：“帮我把最新代码部署上线”</text>
        <text x="12" y="38" class="mono" fill="#475569">Chatbot 回复：</text>
        <text x="12" y="54" class="box-desc" fill="#64748b">“好的！部署步骤如下：1. 跑测试；2. 构建 Docker 镜像；3. 推送镜像并部署...”</text>
        <text x="12" y="72" class="mono-bold" fill="#0f172a">➔ 吐出建议后立即停机（人类必须自己去手动操作）</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#f1f5f9"/>
        <text x="12" y="20" class="box-label" fill="#334155">核心特征：</text>
        <text x="12" y="38" class="box-desc" fill="#64748b">• 单次 Request 对应单次 Response</text>
        <text x="12" y="54" class="box-desc" fill="#64748b">• 无法感知物理环境，不具备自主行动闭环能力</text>
      </g>
    </g>

    <!-- Right: Agent (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dbeafe"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">目标导向自主闭环</text>
      <text x="136" y="30" class="col-title" fill="#1e40af">AI Agent（自主闭环交付）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">用户指令：“帮我把最新代码部署上线”</text>
        <text x="12" y="38" class="mono" fill="#1d4ed8">Agent 自主执行流水线：</text>
        <text x="12" y="54" class="mono" fill="#1d4ed8">• 自动跑测试 ➔ 发现报错 ➔ 自主修 Bug ➔ 重跑通过</text>
        <text x="12" y="72" class="mono-bold" fill="#2563eb">• 自动构建镜像 ➔ 部署 K8s ➔ 终答: “部署成功，服务健康”</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">核心特征：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 给定 High-level 目标，自主多轮循环（Loop）</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 具备观察反馈（Observation）与自愈调整（Self-healing）能力</text>
      </g>
    </g>

  </g>
</svg>
