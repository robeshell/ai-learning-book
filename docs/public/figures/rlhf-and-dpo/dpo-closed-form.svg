<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">DPO 直接偏好优化：绕过显式奖励模型的闭式优雅解</text>
  <text x="36" y="68" class="subtitle">直接偏好优化（DPO）：免除独立奖励模型</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2-Column Comparison -->
  <g transform="translate(36, 114)">

    <!-- Left: Complex PPO (Red/Gray theme) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#fee2e2"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#b91c1c">经典链路</text>
      <text x="116" y="30" class="col-title" fill="#991b1b">RLHF (PPO 强化学习)</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">训练时需加载 4 个庞大模型：</text>
        <text x="12" y="38" class="mono" fill="#0f172a">• Actor 策略网络 + Critic 价值网络</text>
        <text x="12" y="54" class="mono" fill="#0f172a">• 独立 Reward Model + Ref 基准模型</text>
        <text x="12" y="70" class="mono-bold" fill="#dc2626">➔ 显存开销暴涨 4 倍，采样极度耗时不稳定！</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">工程挑战：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• PPO 超参数（Clip 范围、GAE λ 等）极度敏感</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 容易陷入奖励黑客（Reward Hacking）死循环</text>
      </g>
    </g>

    <!-- Right: DPO (Green/Blue theme) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dcfce7"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#15803d">现代标配</text>
      <text x="116" y="30" class="col-title" fill="#166534">DPO（直接偏好优化）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#86efac"/>
        <text x="12" y="20" class="box-label" fill="#166534">闭式等价核心损失：</text>
        <text x="12" y="38" class="mono-bold" fill="#15803d">L_DPO = -E [ log σ( β·log(π/π_ref)_win - β·log(π/π_ref)_lose ) ]</text>
        <text x="12" y="58" class="box-desc" fill="#14532d">• 仅需 2 个模型（Actor + 冻结的 Ref）</text>
        <text x="12" y="72" class="box-desc" fill="#14532d">• 无需显式训练 Reward Model，无需 PPO 采样</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">工程优势：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 像跑 SFT 一样稳定收敛，完全杜绝 PPO 崩溃</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 节约 50% 以上显存与计算时间，成为工业首选</text>
      </g>
    </g>

  </g>
</svg>
