<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .badge-old { font-size: 11px; font-weight: 600; fill: #b45309; }
      .badge-new { font-size: 11px; font-weight: 600; fill: #15803d; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
      .table-header { font-size: 12px; font-weight: 600; fill: #475569; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">词表规模对多语言 Token 压缩率的影响</text>
  <text x="36" y="68" class="subtitle">扩充词表使非英语母语文本不再被生硬拆解为字节碎片，大幅降低显存消耗与 API 成本</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Box: 早期小词表 -->
  <g transform="translate(36, 116)">
    <rect width="430" height="236" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="16" y="16" width="92" height="24" rx="4" fill="#fef3c7"/>
    <text x="62" y="32" text-anchor="middle" class="badge-old">词表 ~50,000</text>
    <text x="118" y="34" class="col-title">早期模型（如 GPT-3.5 / cl100k）</text>

    <!-- Chinese Example -->
    <g transform="translate(16, 54)">
      <rect width="398" height="74" rx="4" fill="#ffffff" stroke="#fef08a"/>
      <text x="14" y="24" class="table-header">输入文本："今天天气真好"</text>
      <text x="14" y="46" class="mono" fill="#b45309">Tokens: [今, 天, 天, 气, 真, 好] (或 UTF-8 碎片)</text>
      <text x="14" y="64" font-size="11px" fill="#d97706">消耗约 6~10 个 Token（1 个汉字 ≈ 1~2 Token）</text>
    </g>

    <!-- Impact Note -->
    <rect x="16" y="140" width="398" height="78" rx="4" fill="#ffffff" stroke="#fef08a"/>
    <text x="14" y="162" font-size="12px" font-weight="600" fill="#b45309">弊端：多语言「Token 刺客」</text>
    <text x="14" y="184" font-size="11.5px" fill="#475569">· 中文序列长度膨胀，达到英文的 2~3 倍</text>
    <text x="14" y="202" font-size="11.5px" fill="#475569">· 严重挤占上下文窗口，推理显存成倍增加</text>
  </g>

  <!-- Right Box: 现代大词表 -->
  <g transform="translate(494, 116)">
    <rect width="430" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="116" height="24" rx="4" fill="#dcfce7"/>
    <text x="74" y="32" text-anchor="middle" class="badge-new">词表 128k ~ 200k</text>
    <text x="142" y="34" class="col-title">现代模型（GPT-4o / Qwen / Llama-3）</text>

    <!-- Chinese Example -->
    <g transform="translate(16, 54)">
      <rect width="398" height="74" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="24" class="table-header">输入文本："今天天气真好"</text>
      <text x="14" y="46" class="mono" fill="#15803d">Tokens: ["今天天气", "真好"] (高频短语聚合)</text>
      <text x="14" y="64" font-size="11px" fill="#16a34a">仅消耗 2~3 个 Token（压缩比提升 200%~300%）</text>
    </g>

    <!-- Impact Note -->
    <rect x="16" y="140" width="398" height="78" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="14" y="162" font-size="12px" font-weight="600" fill="#15803d">优势：紧凑高效，多语言对齐</text>
    <text x="14" y="184" font-size="11.5px" fill="#475569">· 序列长度大幅精简，吞吐速度显著加快</text>
    <text x="14" y="202" font-size="11.5px" fill="#475569">· 相同 128k 窗口下，可容纳的有效中文字数翻倍</text>
  </g>
</svg>
