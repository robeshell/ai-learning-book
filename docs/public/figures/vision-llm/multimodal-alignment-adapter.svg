<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">多模态对齐架构：Vision Encoder 与语言空间投影</text>
  <text x="36" y="68" class="subtitle">视觉编码器与文本空间投影对齐网络</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Vision Encoder & Adapter (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dbeafe"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">特征提取与对齐</text>
      <text x="136" y="30" class="col-title" fill="#1e40af">Vision Encoder + MLP 投影层</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">编码与空间映射（LLaVA / CLIP 路线）：</text>
        <text x="12" y="38" class="mono" fill="#1d4ed8">• Vision Encoder: 提取图像网格特征 H_v (d_v)</text>
        <text x="12" y="54" class="mono" fill="#1d4ed8">• MLP Adapter: H_v' = MLP(H_v) 投影至 (d_text)</text>
        <text x="12" y="70" class="mono-bold" fill="#2563eb">➔ 将视觉向量的维度与语义空间强行对齐到文本空间</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">训练策略：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 预训练阶段：冻结 Vision Encoder 与 LLM，仅训练 MLP 适配器</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 指令微调阶段：解冻 LLM 进行多模态多轮问答端到端微调</text>
      </g>
    </g>

    <!-- Right: Unified Autoregressive LLM (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dcfce7"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#16a34a">统一序列自回归</text>
      <text x="136" y="30" class="col-title" fill="#166534">LLM 统一接收图文混排 Token</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="20" class="box-label" fill="#166534">拼接输入序列：</text>
        <text x="12" y="38" class="mono" fill="#15803d">Input = [ &lt;image&gt;, v_1, ..., v_N, &lt;/image&gt;, "请问图里有什么?" ]</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 自注意力在视觉 Token 与文本 Token 之间自由计算</text>
        <text x="12" y="70" class="mono-bold" fill="#16a34a">➔ 自回归逐词预测下一个文本 Token: "图中有一只猫..."</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">本质认知：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 大模型本质接收的是连续特征向量</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 视觉幻觉源于视觉细节与高频文本统计先验的冲突</text>
      </g>
    </g>

  </g>
</svg>
