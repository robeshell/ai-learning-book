<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">纯线性堆叠塌陷 vs 非线性空间折叠</text>
  <text x="36" y="68" class="subtitle">没有激活函数，堆叠 100 层矩阵相乘在数学上等同于单层；激活函数赋予网络折叠空间拟合任意规律的能力</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2-Column Comparison -->
  <g transform="translate(36, 114)">

    <!-- Left: Pure Linear (Collapse) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#fee2e2"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#b91c1c">纯线性退化</text>
      <text x="116" y="30" class="col-title" fill="#991b1b">无激活函数：多层塌陷为单层</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="12" y="22" class="mono-bold" fill="#991b1b">y = W₃ · (W₂ · (W₁ · x))</text>
        <text x="12" y="42" class="mono-bold" fill="#dc2626">y = (W₃ · W₂ · W₁) · x = W_eq · x</text>
        <text x="12" y="62" class="box-desc" fill="#7f1d1d">• 多个矩阵连乘合并为一个等效矩阵 W_eq</text>
        <text x="12" y="78" class="box-desc" fill="#7f1d1d">• 堆叠 1000 层也无法切分异或（XOR）曲线！</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">几何本质：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 空间只能做刚性拉伸与旋转，无法产生弯折</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 分类决策边界永远只能是一条死板的直线/平面</text>
        <text x="12" y="70" class="mono-bold" fill="#b91c1c">➔ 丧失对现实复杂非线性规律的拟合能力</text>
      </g>
    </g>

    <!-- Right: Non-Linear (Folding) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dcfce7"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#15803d">空间折叠</text>
      <text x="116" y="30" class="col-title" fill="#166534">引入激活函数：万能函数逼近</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="22" class="mono-bold" fill="#15803d">y = σ(W₂ · σ(W₁ · x + b₁) + b₂)</text>
        <text x="12" y="42" class="mono-bold" fill="#166534">σ 激活函数打破矩阵可合并性！</text>
        <text x="12" y="62" class="box-desc" fill="#14532d">• 每一层都在前一层的折叠空间上继续变换</text>
        <text x="12" y="78" class="box-desc" fill="#14532d">• 万能逼近定理：足够多神经元可拟合任意连续函数</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">几何本质：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 像折纸一样把高维空间沿着决策线反复对折</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 纠缠的非线性数据在折叠后变得线性可分</text>
        <text x="12" y="70" class="mono-bold" fill="#15803d">👉 深度神经网络实现复杂模式识别与非线性分类的根本源泉</text>
      </g>
    </g>

  </g>
</svg>
