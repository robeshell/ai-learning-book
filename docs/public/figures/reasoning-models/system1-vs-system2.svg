<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">快思考（System 1）vs 慢思考（System 2）：直觉直出与长思维链</text>
  <text x="36" y="68" class="subtitle">传统对话模型依赖单步前向直觉，深度推理模型通过隐式草稿纸自发展开多步探索、反思与回溯</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2-Column Architecture Comparison -->
  <g transform="translate(36, 114)">

    <!-- Left: Standard Chat (System 1) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#e2e8f0"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#475569">快思考 (系统 1)</text>
      <text x="116" y="30" class="col-title" fill="#0f172a">标准对话模型（直觉直出）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="20" class="mono-bold" fill="#0f172a">Prompt ➔ [单步直接生成回答]</text>
        <text x="12" y="40" class="box-desc" fill="#64748b">• 无论问题多难，每个 Token 耗费固定常数算力</text>
        <text x="12" y="56" class="box-desc" fill="#64748b">• 面对多步数理奥赛题，单步计算极易「卡壳」翻车</text>
        <text x="12" y="72" class="mono" fill="#dc2626">➔ 一旦开局走偏，后续错误自回归滚雪球</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#f1f5f9"/>
        <text x="12" y="20" class="box-label" fill="#334155">物理特征：</text>
        <text x="12" y="38" class="box-desc" fill="#64748b">• 输出 Token 极少，响应速度极快（秒级返回）</text>
        <text x="12" y="54" class="box-desc" fill="#64748b">• 适合日常闲聊、翻译、公文总结等直觉任务</text>
      </g>
    </g>

    <!-- Right: Reasoning Model (System 2) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dbeafe"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">慢思考 (系统 2)</text>
      <text x="116" y="30" class="col-title" fill="#1e40af">深度推理模型（o1 / DeepSeek-R1）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="mono-bold" fill="#1e40af">Prompt ➔ &lt;think&gt; 展开数千 Token 思考 &lt;/think&gt; ➔ 答案</text>
        <text x="12" y="40" class="box-desc" fill="#1e3a8a">• 自主拆解步骤：“首先分析边界条件...”</text>
        <text x="12" y="56" class="box-desc" fill="#1e3a8a">• 主动反思纠错：“等等，这个公式不对，让我换种解法...”</text>
        <text x="12" y="72" class="mono-bold" fill="#2563eb">➔ 测试时计算（Test-Time Compute）突破智力上限</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">物理特征：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 牺牲时间与显存（思考 30 秒，消耗数千 Token）</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 专精高难度数学证明、算法竞赛与复杂长链逻辑</text>
      </g>
    </g>

  </g>
</svg>
