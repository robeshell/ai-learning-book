<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">闭卷参数记忆 vs 开卷外挂 RAG：两种知识注入路径对比</text>
  <text x="36" y="68" class="subtitle">微调将知识硬编码进权重矩阵，RAG 动态检索上下文注入窗口，在更新成本、可溯源性与幻觉上有本质差异</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2-Column Comparison -->
  <g transform="translate(36, 114)">

    <!-- Left: Fine-Tuning (Closed-Book) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#fee2e2"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#b91c1c">闭卷考试</text>
      <text x="116" y="30" class="col-title" fill="#991b1b">模型微调 / 预训练（参数硬编码）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">机制：把知识强行刷进参数权重</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 知识更新：必须重新微调或训练，周期长、耗资大</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 幻觉概率：高！模型容易用高概率统计特征模糊混淆</text>
        <text x="12" y="70" class="mono-bold" fill="#dc2626">➔ 回答无法溯源具体哪篇文档、哪一行文字</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">适用场景：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 学习稳定的专业语言风格、行业术语与格式规范</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 不适合频繁变动的企业内部规章与动态数据库</text>
      </g>
    </g>

    <!-- Right: RAG (Open-Book) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dcfce7"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#15803d">开卷考试</text>
      <text x="116" y="30" class="col-title" fill="#166534">RAG 检索增强（上下文动态注入）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#86efac"/>
        <text x="12" y="20" class="box-label" fill="#166534">机制：每次提问先查资料塞进上下文</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 知识更新：秒级增删改查向量库，无需重新训练</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 幻觉抑制：强！模型只需总结提炼窗口中的依据</text>
        <text x="12" y="70" class="mono-bold" fill="#15803d">➔ 每一句回答均可精准标注文档来源与段落引用</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">适用场景：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 企业私有知识库、最新法律法规、技术支持手册</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 要求高准确率、必须可解释与可审计的严肃业务</text>
      </g>
    </g>

  </g>
</svg>
