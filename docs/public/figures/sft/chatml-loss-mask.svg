<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">SFT 训练机制：ChatML 角色封装与损失掩码（Loss Mask）</text>
  <text x="36" y="68" class="subtitle">通过特殊边界 Token 切分多角色，且仅对 Assistant 回答部分计算梯度，严防模型背诵 Prompt</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Pipeline Structure -->
  <g transform="translate(36, 114)">

    <!-- Top: Token Sequence with Roles (Width: 888) -->
    <g transform="translate(0, 0)">
      <rect width="888" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="18" y="24" class="col-title" fill="#0f172a">输入序列的 ChatML 角色封装（Tokens Sequence）</text>

      <!-- Segment 1: System -->
      <g transform="translate(18, 38)">
        <rect width="180" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="10" y="18" class="mono-bold" fill="#1d4ed8">&lt;|im_start|&gt;system</text>
        <text x="10" y="34" class="mono" fill="#1e40af">你是一个严谨的助手&lt;|im_end|&gt;</text>
      </g>

      <!-- Segment 2: User -->
      <g transform="translate(208, 38)">
        <rect width="210" height="42" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="10" y="18" class="mono-bold" fill="#15803d">&lt;|im_start|&gt;user</text>
        <text x="10" y="34" class="mono" fill="#166534">请用一句话介绍太阳&lt;|im_end|&gt;</text>
      </g>

      <!-- Segment 3: Assistant (Target) -->
      <g transform="translate(428, 38)">
        <rect width="442" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="10" y="18" class="mono-bold" fill="#b45309">&lt;|im_start|&gt;assistant</text>
        <text x="10" y="34" class="mono-bold" fill="#92400e">太阳是太阳系中心的巨大发光热等离子体恒星。&lt;|im_end|&gt;</text>
      </g>
    </g>

    <!-- Bottom: Loss Masking Logic (Width: 888) -->
    <g transform="translate(0, 114)">
      <rect width="888" height="122" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Left: Prompt Masked -->
      <g transform="translate(18, 16)">
        <rect width="400" height="90" rx="4" fill="#fee2e2"/>
        <text x="12" y="24" class="box-label" fill="#991b1b">Prompt 部分（System + User）：</text>
        <text x="12" y="46" class="mono-bold" fill="#dc2626">标签 Label = -100 ➔ 掩码丢弃（Mask = 0）</text>
        <text x="12" y="66" class="box-desc" fill="#7f1d1d">• 不计算交叉熵 Loss，不产生反向传播梯度</text>
        <text x="12" y="80" class="box-desc" fill="#7f1d1d">• 防止模型浪费参数去死记硬背用户的提问内容</text>
      </g>

      <!-- Right: Response Calculated -->
      <g transform="translate(428, 16)">
        <rect width="442" height="90" rx="4" fill="#dcfce7"/>
        <text x="12" y="24" class="box-label" fill="#166534">Response 部分（Assistant 回答）：</text>
        <text x="12" y="46" class="mono-bold" fill="#15803d">标签 Label = 真实 Token ➔ 全量求导（Mask = 1）</text>
        <text x="12" y="66" class="box-desc" fill="#14532d">• 仅对模型生成的每个字计算 Loss = -log P(token)</text>
        <text x="12" y="80" class="box-desc" fill="#14532d">• 强力塑造模型的问答口吻、角色遵从度与停止符触发</text>
      </g>
    </g>

  </g>
</svg>
