<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">中间状态缓存机制：空间换时间的工程权衡</text>
  <text x="36" y="68" class="subtitle">序列计算时将历史中间状态驻留内存，避免每次追加新数据都推倒重算整条历史</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2-Column Comparison -->
  <g transform="translate(36, 114)">

    <!-- Left: Without Cache (Red/Gray theme) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#fee2e2"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#b91c1c">暴算模式</text>
      <text x="116" y="30" class="col-title" fill="#991b1b">无缓存（每步全量重算）</text>

      <g transform="translate(16, 50)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="12" y="22" class="box-label" fill="#991b1b">追加第 t 步数据计算：</text>
        <text x="12" y="42" class="mono" fill="#0f172a">• 历史 1 ~ t-1 的所有中间状态全部推倒重算</text>
        <text x="12" y="60" class="mono" fill="#0f172a">• 累积计算复杂度：随序列长度呈 O(T²) 爆炸</text>
        <text x="12" y="76" class="mono-bold" fill="#dc2626">➔ 算力被大量重复矩阵乘加挤爆！</text>
      </g>

      <g transform="translate(16, 146)">
        <rect width="394" height="74" rx="4" fill="#fee2e2"/>
        <text x="12" y="22" class="box-label" fill="#991b1b">物理代价：</text>
        <text x="12" y="42" class="box-desc" fill="#7f1d1d">• 内存开销小（不存历史中间状态）</text>
        <text x="12" y="60" class="box-desc" fill="#7f1d1d">• 延迟极高：序列变长时计算耗时急剧上升</text>
      </g>
    </g>

    <!-- Right: With KV Cache (Green/Blue theme) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#15803d"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#ffffff">工程标准</text>
      <text x="116" y="30" class="col-title" fill="#166534">启用状态缓存（空间换时间）</text>

      <g transform="translate(16, 50)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#86efac"/>
        <text x="12" y="22" class="box-label" fill="#166534">追加第 t 步数据计算：</text>
        <text x="12" y="42" class="mono" fill="#0f172a">• 历史 1 ~ t-1 的中间特征直接从内存读取</text>
        <text x="12" y="60" class="mono" fill="#0f172a">• 仅需计算新来数据 t 的增量状态并与缓存融合</text>
        <text x="12" y="76" class="mono-bold" fill="#15803d">➔ 单步增量计算降至 O(1)，处理速率恒定！</text>
      </g>

      <g transform="translate(16, 146)">
        <rect width="394" height="74" rx="4" fill="#dcfce7"/>
        <text x="12" y="22" class="box-label" fill="#166534">工程权衡：</text>
        <text x="12" y="42" class="box-desc" fill="#14532d">• 牺牲内存空间：每个历史节点占用缓存</text>
        <text x="12" y="60" class="box-desc" fill="#14532d">• 换取低延迟响应：实时交互系统的核心支柱</text>
      </g>
    </g>

  </g>
</svg>
