<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <marker id="tree-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">前缀树（Trie / Radix Tree）：中间状态缓存共享的数据结构底座</text>
  <text x="36" y="68" class="subtitle">基于最长公共前缀（LCP）的多分支内存状态共享</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tree Diagram & Details -->
  <g transform="translate(36, 114)">

    <!-- Left: Tree Topology (Width: 540) -->
    <g transform="translate(0, 0)">
      <rect width="540" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="18" y="28" class="col-title" fill="#0f172a">内存中的前缀缓存树（Radix Cache Tree）</text>

      <!-- Root Node: System Prompt -->
      <g transform="translate(18, 44)">
        <rect width="504" height="42" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="14" y="26" class="mono-bold" fill="#1e40af">根节点 [系统公共模板] ➔ Block #0</text>
      </g>

      <!-- Connectors from Root to Branch 1 & Branch 2 -->
      <path d="M 140 86 L 140 114" stroke="#3b82f6" stroke-width="2" marker-end="url(#tree-arrow)"/>
      <path d="M 390 86 L 390 114" stroke="#3b82f6" stroke-width="2" marker-end="url(#tree-arrow)"/>

      <!-- Branch 1: User A -->
      <g transform="translate(18, 116)">
        <rect width="240" height="44" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="10" y="20" class="mono-bold" fill="#166534">分支 A: 会话 1 [子任务 A]</text>
        <text x="10" y="36" class="mono" fill="#15803d">Block #1 (200 状态缓存)</text>
      </g>

      <!-- Branch 2: User B -->
      <g transform="translate(282, 116)">
        <rect width="240" height="44" rx="4" fill="#f0fdf4" stroke="#86efac"/>
        <text x="10" y="20" class="mono-bold" fill="#166534">分支 B: 会话 2 [子任务 B]</text>
        <text x="10" y="36" class="mono" fill="#15803d">Block #2 (200 状态缓存)</text>
      </g>

      <!-- Connectors to Leaves -->
      <path d="M 140 160 L 140 180" stroke="#10b981" stroke-width="1.5" marker-end="url(#tree-arrow)"/>
      <path d="M 390 160 L 390 180" stroke="#10b981" stroke-width="1.5" marker-end="url(#tree-arrow)"/>

      <!-- Leaf 1: User A Turn 2 -->
      <g transform="translate(18, 182)">
        <rect width="240" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
        <text x="10" y="18" class="mono-bold" fill="#92400e">第 2 轮: 延续分支 A</text>
        <text x="10" y="32" class="mono" fill="#b45309">复用 Block 0+1 (免除前缀重算)</text>
      </g>

      <!-- Leaf 2: User B Turn 2 -->
      <g transform="translate(282, 182)">
        <rect width="240" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
        <text x="10" y="18" class="mono-bold" fill="#92400e">第 2 轮: 延续分支 B</text>
        <text x="10" y="32" class="mono" fill="#b45309">复用 Block 0+2 (免除前缀重算)</text>
      </g>
    </g>

    <!-- Right: Tree Mechanism Ledger (Width: 328) -->
    <g transform="translate(560, 0)">
      <rect width="328" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dbeafe"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">架构价值</text>
      <text x="116" y="30" class="col-title" fill="#1e40af">前缀树命中收益</text>

      <g transform="translate(16, 48)">
        <rect width="296" height="74" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="22" class="box-label" fill="#1e40af">最长公共前缀（LCP）匹配：</text>
        <text x="12" y="42" class="box-desc" fill="#0f172a">• 公共前缀仅需计算一次</text>
        <text x="12" y="58" class="box-desc" fill="#0f172a">• 命中前缀的中间状态计算耗时归零</text>
      </g>

      <g transform="translate(16, 132)">
        <rect width="296" height="88" rx="4" fill="#dbeafe"/>
        <text x="10" y="22" class="box-label" fill="#1e40af">真实工业落地应用：</text>
        <text x="10" y="42" class="box-desc" fill="#1e3a8a">• 提升多会话并发吞吐与内存效率</text>
        <text x="10" y="58" class="box-desc" fill="#1e3a8a">• 共享前缀命中免除庞大重复计算</text>
        <text x="10" y="74" class="box-desc" fill="#1e3a8a">• 显著降低交互式系统的响应首包延迟</text>
      </g>
    </g>

  </g>
</svg>
