<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">无状态 HTTP 请求：多轮交互中的数据「滚雪球」累积</text>
  <text x="36" y="68" class="subtitle">无状态服务端协议与多轮交互历史累积重传机制</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Comparison Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Multi-turn Requests (Width: 560) -->
    <g transform="translate(0, 0)">
      <rect width="560" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="28" class="col-title" fill="#0f172a">客户端发起的独立 HTTP POST 请求流水线</text>

      <!-- Round 1 -->
      <g transform="translate(20, 44)">
        <rect width="520" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <rect x="10" y="10" width="60" height="28" rx="3" fill="#e2e8f0"/>
        <text x="40" y="28" text-anchor="middle" class="tag" fill="#334155">第 1 轮</text>
        <!-- Segments -->
        <rect x="80" y="12" width="105" height="24" rx="3" fill="#dbeafe"/>
        <text x="132" y="28" text-anchor="middle" class="mono" fill="#1e40af">System (100)</text>
        <rect x="192" y="12" width="85" height="24" rx="3" fill="#dcfce7"/>
        <text x="234" y="28" text-anchor="middle" class="mono" fill="#166534">User 1 (20)</text>
        <text x="286" y="28" class="mono" fill="#64748b">➔ 吐出 M1 (80)</text>
        <text x="430" y="28" class="mono-bold" fill="#0f172a">入: 120 / 出: 80</text>
      </g>

      <!-- Round 2 -->
      <g transform="translate(20, 100)">
        <rect width="520" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <rect x="10" y="10" width="60" height="28" rx="3" fill="#e2e8f0"/>
        <text x="40" y="28" text-anchor="middle" class="tag" fill="#334155">第 2 轮</text>
        <!-- Segments -->
        <rect x="80" y="12" width="65" height="24" rx="3" fill="#dbeafe"/>
        <text x="112" y="28" text-anchor="middle" class="mono" fill="#1e40af">Sys(100)</text>
        <rect x="150" y="12" width="55" height="24" rx="3" fill="#dcfce7"/>
        <text x="177" y="28" text-anchor="middle" class="mono" fill="#166534">U1(20)</text>
        <rect x="210" y="12" width="55" height="24" rx="3" fill="#fef3c7"/>
        <text x="237" y="28" text-anchor="middle" class="mono" fill="#92400e">M1(80)</text>
        <rect x="270" y="12" width="55" height="24" rx="3" fill="#dcfce7"/>
        <text x="297" y="28" text-anchor="middle" class="mono" fill="#166534">U2(30)</text>
        <text x="334" y="28" class="mono" fill="#64748b">➔ M2(90)</text>
        <text x="430" y="28" class="mono-bold" fill="#d97706">入: 230 / 出: 90</text>
      </g>

      <!-- Round 3 -->
      <g transform="translate(20, 156)">
        <rect width="520" height="58" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <rect x="10" y="14" width="60" height="30" rx="3" fill="#fee2e2"/>
        <text x="40" y="33" text-anchor="middle" class="tag" fill="#dc2626">第 3 轮</text>
        <!-- Segments -->
        <rect x="80" y="14" width="240" height="30" rx="3" fill="#fee2e2" stroke="#f87171" stroke-dasharray="2 2"/>
        <text x="200" y="33" text-anchor="middle" class="mono-bold" fill="#b91c1c">全量重传前序历史 (320 字)</text>
        <rect x="328" y="14" width="65" height="30" rx="3" fill="#dcfce7"/>
        <text x="360" y="33" text-anchor="middle" class="mono" fill="#166534">U3(50)</text>
        <text x="415" y="33" class="mono-bold" fill="#dc2626">入: 370 / 出: 100</text>
      </g>
    </g>

    <!-- Right: Arithmetic Impact (Width: 308) -->
    <g transform="translate(580, 0)">
      <rect width="308" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dbeafe"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">物理规律</text>
      <text x="116" y="30" class="col-title" fill="#1e40af">无状态计算账本</text>

      <g transform="translate(16, 48)">
        <rect width="276" height="74" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="22" class="box-label" fill="#1e40af">输入 Token 呈等差级数激增：</text>
        <text x="12" y="42" class="mono" fill="#0f172a">第 N 轮输入 = 历史总和 + U_N</text>
        <text x="12" y="60" class="mono" fill="#dc2626">3 轮累积: 200 + 320 + 470 = 990</text>
      </g>

      <g transform="translate(16, 132)">
        <rect width="276" height="88" rx="4" fill="#dbeafe"/>
        <text x="10" y="22" class="box-label" fill="#1e40af">核心物理痛点：</text>
        <text x="10" y="42" class="box-desc" fill="#1e3a8a">• 模型“记忆”纯靠每次重传历史</text>
        <text x="10" y="58" class="box-desc" fill="#1e3a8a">• 无缓存时每轮需重复解析前序历史</text>
        <text x="10" y="74" class="box-desc" fill="#1e3a8a">• 引入前缀状态缓存降低重算开销</text>
      </g>
    </g>

  </g>
</svg>
