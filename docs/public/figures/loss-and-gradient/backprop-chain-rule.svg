<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="40" class="title">反向传播与链式法则：误差梯度的倒流流水线</text>
  <text x="36" y="64" class="subtitle">前向预测度量损失，反向链式求导倒流更新参数</text>
  <line x1="36" y1="86" x2="924" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Pipeline Structure -->
  <g transform="translate(36, 104)">

    <!-- Top Track: Forward Pass (Width: 888) -->
    <g transform="translate(0, 0)">
      <rect width="888" height="114" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="14" y="10" width="76" height="20" rx="3" fill="#dbeafe"/>
      <text x="52" y="24" text-anchor="middle" class="tag" fill="#1d4ed8">前向传播</text>
      <text x="100" y="25" class="col-title" fill="#1e40af">正向计算流（从输入特征到标量损失）</text>

      <!-- Steps 1 to 4 in Forward Pass -->
      <!-- Step 1: Input -->
      <g transform="translate(14, 42)">
        <rect width="160" height="58" rx="4" fill="#ffffff" stroke="#93c5fd"/>
        <text x="10" y="22" class="mono-bold" fill="#1e40af">输入特征: x</text>
        <text x="10" y="42" class="mono" fill="#64748b">原始数据向量</text>
      </g>

      <!-- Forward Arrow 1 -->
      <line x1="180" y1="71" x2="220" y2="71" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Step 2: Hidden -->
      <g transform="translate(226, 42)">
        <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#93c5fd"/>
        <text x="10" y="22" class="mono-bold" fill="#1e40af">隐层: z = Wx + b</text>
        <text x="10" y="42" class="mono" fill="#2563eb">激活输出: a = σ(z)</text>
      </g>

      <!-- Forward Arrow 2 -->
      <line x1="432" y1="71" x2="472" y2="71" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Step 3: Softmax Output -->
      <g transform="translate(478, 42)">
        <rect width="200" height="58" rx="4" fill="#ffffff" stroke="#93c5fd"/>
        <text x="10" y="22" class="mono-bold" fill="#1e40af">预测: P = Softmax(z)</text>
        <text x="10" y="42" class="mono" fill="#64748b">类别概率分布</text>
      </g>

      <!-- Forward Arrow 3 -->
      <line x1="684" y1="71" x2="724" y2="71" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Step 4: Loss Calculation -->
      <g transform="translate(730, 42)">
        <rect width="144" height="58" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="10" y="22" class="mono-bold" fill="#b91c1c">交叉熵 Loss</text>
        <text x="10" y="42" class="mono-bold" fill="#dc2626">L = -log P(y_true)</text>
      </g>
    </g>

    <!-- Bottom Track: Backward Pass (Width: 888) -->
    <g transform="translate(0, 130)">
      <rect width="888" height="136" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="14" y="10" width="76" height="20" rx="3" fill="#fee2e2"/>
      <text x="52" y="24" text-anchor="middle" class="tag" fill="#b91c1c">反向传播</text>
      <text x="100" y="25" class="col-title" fill="#991b1b">梯度倒流链（链式法则反向求导与参数更新）</text>

      <!-- Step 3 (Left): Weight Gradient & Update -->
      <g transform="translate(14, 42)">
        <rect width="250" height="78" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="10" y="20" class="mono-bold" fill="#dc2626">权重梯度: ∂L/∂W = (∂L/∂z) · xᵀ</text>
        <text x="10" y="40" class="mono-bold" fill="#991b1b">参数更新: W ← W - η · ∂L/∂W</text>
        <text x="10" y="62" class="box-desc" fill="#7f1d1d">• 将误差修正落实到具体权重参数</text>
      </g>

      <!-- Backward Arrow 2 (from middle to left) -->
      <line x1="314" y1="81" x2="270" y2="81" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Step 2 (Middle): Hidden Layer Gradient -->
      <g transform="translate(320, 42)">
        <rect width="260" height="78" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="10" y="20" class="mono-bold" fill="#dc2626">隐层梯度: ∂L/∂z = (∂L/∂a) · σ'(z)</text>
        <text x="10" y="42" class="box-desc" fill="#7f1d1d">• 穿过激活函数的导数闸门</text>
        <text x="10" y="62" class="mono" fill="#b91c1c">GELU / ReLU 导数决定梯度通断</text>
      </g>

      <!-- Backward Arrow 1 (from right to middle) -->
      <line x1="620" y1="81" x2="586" y2="81" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

      <!-- Step 1 (Right): Loss to Logits Gradient -->
      <g transform="translate(626, 42)">
        <rect width="248" height="78" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <text x="10" y="20" class="mono-bold" fill="#dc2626">输出端梯度: ∂L/∂z_out = P - y</text>
        <text x="10" y="42" class="box-desc" fill="#7f1d1d">Softmax + 交叉熵损失优美导数：</text>
        <text x="10" y="62" class="mono-bold" fill="#b91c1c">直接等于「预测概率 - 真实标签」！</text>
      </g>
    </g>

  </g>
</svg>
