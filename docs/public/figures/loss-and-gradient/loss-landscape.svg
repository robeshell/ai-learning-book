<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">损失曲面与梯度下降：高维浓雾中的「盲人下山」</text>
  <text x="36" y="68" class="subtitle">公式：W_new = W_old - η · ∇_W L —— 沿着损失曲面最陡峭的负梯度方向，以学习率 η 逐步逼近最优解</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 3 Cases Container -->
  <g transform="translate(36, 114)">

    <!-- Case 1: Learning Rate Too Large (Red) -->
    <g transform="translate(0, 0)">
      <rect width="284" height="236" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#fee2e2"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#b91c1c">步子太大</text>
      <text x="104" y="30" class="col-title" fill="#991b1b">学习率过大（η 偏高）</text>

      <!-- Curve graphic -->
      <g transform="translate(14, 50)">
        <rect width="256" height="74" rx="4" fill="#ffffff" stroke="#fca5a5"/>
        <!-- U-shaped loss curve -->
        <path d="M 20 20 Q 128 75, 236 20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
        <!-- Overshoot steps -->
        <path d="M 35 28 L 220 30 L 50 45 L 195 48" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>
        <circle cx="35" cy="28" r="4" fill="#dc2626"/>
        <circle cx="220" cy="30" r="4" fill="#dc2626"/>
        <circle cx="50" cy="45" r="4" fill="#dc2626"/>
        <text x="128" y="68" text-anchor="middle" class="mono-bold" fill="#dc2626">剧烈震荡甚至发散！</text>
      </g>

      <g transform="translate(14, 134)">
        <rect width="256" height="88" rx="4" fill="#fee2e2"/>
        <text x="10" y="20" class="mono-bold" fill="#991b1b">物理后果：</text>
        <text x="10" y="38" class="box-desc" fill="#7f1d1d">• 一步直接跨过最优点谷底</text>
        <text x="10" y="52" class="box-desc" fill="#7f1d1d">• 损失值不断激增（Loss Exploding）</text>
        <text x="10" y="72" class="mono" fill="#b91c1c">➔ 训练遭遇 NaN 崩盘</text>
      </g>
    </g>

    <!-- Case 2: Learning Rate Too Small (Gray) -->
    <g transform="translate(302, 0)">
      <rect width="284" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#e2e8f0"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#475569">步子太小</text>
      <text x="104" y="30" class="col-title" fill="#0f172a">学习率过小（η 偏低）</text>

      <!-- Curve graphic -->
      <g transform="translate(14, 50)">
        <rect width="256" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <path d="M 20 20 Q 128 75, 236 20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
        <!-- Tiny steps -->
        <path d="M 35 28 L 45 34 L 55 40 L 65 46" fill="none" stroke="#64748b" stroke-width="2"/>
        <circle cx="35" cy="28" r="3" fill="#475569"/>
        <circle cx="45" cy="34" r="3" fill="#475569"/>
        <circle cx="55" cy="40" r="3" fill="#475569"/>
        <circle cx="65" cy="46" r="3" fill="#475569"/>
        <text x="128" y="68" text-anchor="middle" class="mono" fill="#475569">爬行缓慢，易困在局部极小</text>
      </g>

      <g transform="translate(14, 134)">
        <rect width="256" height="88" rx="4" fill="#f1f5f9"/>
        <text x="10" y="20" class="mono-bold" fill="#334155">物理后果：</text>
        <text x="10" y="38" class="box-desc" fill="#475569">• 算力资源被巨量空转浪费</text>
        <text x="10" y="52" class="box-desc" fill="#475569">• 容易卡死在鞍点（Saddle Point）</text>
        <text x="10" y="72" class="mono" fill="#64748b">➔ 训练几个月依然无法收敛</text>
      </g>
    </g>

    <!-- Case 3: Optimal Learning Rate (Green) -->
    <g transform="translate(604, 0)">
      <rect width="284" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#dcfce7"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#15803d">黄金步长</text>
      <text x="104" y="30" class="col-title" fill="#166534">合适学习率 + 余弦退火</text>

      <!-- Curve graphic -->
      <g transform="translate(14, 50)">
        <rect width="256" height="74" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <path d="M 20 20 Q 128 75, 236 20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
        <!-- Smooth steps to bottom -->
        <path d="M 35 28 L 75 52 L 105 64 L 128 67" fill="none" stroke="#16a34a" stroke-width="2"/>
        <circle cx="35" cy="28" r="4" fill="#15803d"/>
        <circle cx="75" cy="52" r="3.5" fill="#15803d"/>
        <circle cx="105" cy="64" r="3" fill="#15803d"/>
        <circle cx="128" cy="67" r="5" fill="#059669"/>
        <text x="128" y="25" text-anchor="middle" class="mono-bold" fill="#15803d">精准平稳落入全局谷底</text>
      </g>

      <g transform="translate(14, 134)">
        <rect width="256" height="88" rx="4" fill="#dcfce7"/>
        <text x="10" y="20" class="mono-bold" fill="#166534">工业实践：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 初始阶段 Warmup 缓慢预热</text>
        <text x="10" y="52" class="box-desc" fill="#14532d">• 中后期 Cosine Decay 逐步衰减</text>
        <text x="10" y="72" class="mono-bold" fill="#15803d">👉 深度网络稳定收敛的核心保障</text>
      </g>
    </g>

  </g>
</svg>
