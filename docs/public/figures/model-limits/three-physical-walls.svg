<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">大模型演进的三大客观物理墙（Physical Walls）</text>
  <text x="36" y="68" class="subtitle">算力能耗、数据枯竭与语义理解物理之墙</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 3 Walls Grid -->
  <g transform="translate(36, 114)">

    <!-- Wall 1: Data Wall (Width: 280) -->
    <g transform="translate(0, 0)">
      <rect width="280" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#fee2e2"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#dc2626">第一道墙</text>
      <text x="16" y="56" class="col-title" fill="#991b1b">高质量语料枯竭墙</text>

      <g transform="translate(16, 70)">
        <rect width="248" height="74" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="10" y="20" class="box-label" fill="#991b1b">数据物理极限：</text>
        <text x="10" y="38" class="mono" fill="#7f1d1d">• 人类高质量存量语料即将耗尽</text>
        <text x="10" y="54" class="mono" fill="#7f1d1d">• 合成数据递归引发模型崩溃 (MAD)</text>
      </g>

      <g transform="translate(16, 154)">
        <rect width="248" height="66" rx="4" fill="#fee2e2"/>
        <text x="10" y="20" class="box-label" fill="#991b1b">核心本质：</text>
        <text x="10" y="38" class="box-desc" fill="#7f1d1d">• 缺乏真实世界全新物理经验输入</text>
        <text x="10" y="54" class="box-desc" fill="#7f1d1d">• 单纯扩大参数面临无米之炊</text>
      </g>
    </g>

    <!-- Wall 2: Energy & Compute (Width: 280) -->
    <g transform="translate(304, 0)">
      <rect width="280" height="236" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#fef9c3"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#ca8a04">第二道墙</text>
      <text x="16" y="56" class="col-title" fill="#854d0e">能源与边际收益墙</text>

      <g transform="translate(16, 70)">
        <rect width="248" height="74" rx="4" fill="#ffffff" stroke="#fef08a"/>
        <text x="10" y="20" class="box-label" fill="#854d0e">幂律边际递减：</text>
        <text x="10" y="38" class="mono" fill="#a16207">• Loss ∝ C^(-α)，α 仅约 0.05</text>
        <text x="10" y="54" class="mono" fill="#a16207">• 性能微弱提升需 100 倍算力电网</text>
      </g>

      <g transform="translate(16, 154)">
        <rect width="248" height="66" rx="4" fill="#fef9c3"/>
        <text x="10" y="20" class="box-label" fill="#854d0e">核心本质：</text>
        <text x="10" y="38" class="box-desc" fill="#713f12">• 训练成本逼近十亿百亿美元天花板</text>
        <text x="10" y="54" class="box-desc" fill="#713f12">• 受制于全球发电量与热力学耗散</text>
      </g>
    </g>

    <!-- Wall 3: Probabilistic Error (Width: 280) -->
    <g transform="translate(608, 0)">
      <rect width="280" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dbeafe"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">第三道墙</text>
      <text x="16" y="56" class="col-title" fill="#1e40af">统计非零误差墙</text>

      <g transform="translate(16, 70)">
        <rect width="248" height="74" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">数学本质不可消除：</text>
        <text x="10" y="38" class="mono" fill="#1d4ed8">• 自回归是概率密度拟合 P(w|x)</text>
        <text x="10" y="54" class="mono" fill="#1d4ed8">• 尾部长尾分布错误率恒 &gt; 0</text>
      </g>

      <g transform="translate(16, 154)">
        <rect width="248" height="66" rx="4" fill="#dbeafe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">核心本质：</text>
        <text x="10" y="38" class="box-desc" fill="#1e3a8a">• 算力换不来绝对真理与因果担保</text>
        <text x="10" y="54" class="box-desc" fill="#1e3a8a">• 最终价值与法律责任不可外包</text>
      </g>
    </g>

  </g>
</svg>
