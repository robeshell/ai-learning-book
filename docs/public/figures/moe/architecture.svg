<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 600; }
      .box-desc { font-size: 11px; font-weight: 400; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Dense（密集模型）vs Sparse MoE（混合专家模型）架构对比</text>
  <text x="36" y="68" class="subtitle">MoE 通过门控路由器（Router）为每个 Token 动态挑选 Top-K 专家，打破参数与计算量的绑定</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Column: Dense Model -->
  <g transform="translate(36, 114)">
    <rect width="430" height="280" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="105" height="24" rx="4" fill="#e2e8f0"/>
    <text x="68" y="32" text-anchor="middle" class="tag" fill="#334155">传统密集架构</text>
    <text x="132" y="33" class="col-title" fill="#0f172a">Dense 前馈网络 (FFN)</text>

    <!-- Content -->
    <g transform="translate(16, 54)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="14" y="20" class="box-label" fill="#0f172a">全量参数硬连线计算</text>
      <text x="14" y="38" class="box-desc" fill="#64748b">每个 Token 都必须通过 100% 的前馈网络权重</text>
    </g>

    <g transform="translate(16, 114)">
      <rect width="398" height="86" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="14" y="14" width="370" height="58" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="199" y="38" text-anchor="middle" font-size="13px" font-weight="700" fill="#334155">单一巨大 FFN 网络 (70B 全量激活)</text>
      <text x="199" y="56" text-anchor="middle" class="mono" fill="#64748b">FLOPs = 100%  |  计算开销极高</text>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(16, 212)">
      <rect width="398" height="52" rx="4" fill="#fee2e2"/>
      <text x="14" y="22" class="box-label" fill="#991b1b">物理代价：参数量与算力严格 1:1 绑定</text>
      <text x="14" y="40" class="box-desc" fill="#b91c1c">想把模型知识容量做大，每次推理的 FLOPs 必须成倍暴涨</text>
    </g>
  </g>

  <!-- Right Column: Sparse MoE Model -->
  <g transform="translate(494, 114)">
    <rect width="430" height="280" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="115" height="24" rx="4" fill="#dcfce7"/>
    <text x="73" y="32" text-anchor="middle" class="tag" fill="#15803d">稀疏专家架构</text>
    <text x="141" y="33" class="col-title" fill="#166534">Sparse MoE 动态路由</text>

    <!-- Router Box -->
    <g transform="translate(16, 54)">
      <rect width="398" height="42" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="18" class="box-label" fill="#166534">门控路由器 (Gating Router)</text>
      <text x="14" y="34" class="mono" fill="#15803d">Softmax(Top-2 Router Logits) → 挑选最佳 2 个专家</text>
    </g>

    <!-- Experts Grid -->
    <g transform="translate(16, 104)">
      <!-- Expert 1 (Active) -->
      <rect x="0" y="0" width="90" height="42" rx="4" fill="#dcfce7" stroke="#86efac"/>
      <text x="45" y="18" text-anchor="middle" font-size="10.5px" font-weight="700" fill="#15803d">Expert 1</text>
      <text x="45" y="32" text-anchor="middle" class="mono" fill="#16a34a">激活 (65%)</text>

      <!-- Expert 2 (Sleeping) -->
      <rect x="102" y="0" width="90" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2,2"/>
      <text x="147" y="18" text-anchor="middle" font-size="10.5px" font-weight="600" fill="#94a3b8">Expert 2</text>
      <text x="147" y="32" text-anchor="middle" font-size="9.5px" fill="#cbd5e1">休眠</text>

      <!-- Expert 3 (Active) -->
      <rect x="204" y="0" width="90" height="42" rx="4" fill="#dcfce7" stroke="#86efac"/>
      <text x="249" y="18" text-anchor="middle" font-size="10.5px" font-weight="700" fill="#15803d">Expert 3</text>
      <text x="249" y="32" text-anchor="middle" class="mono" fill="#16a34a">激活 (35%)</text>

      <!-- Expert 4~8 (Sleeping) -->
      <rect x="306" y="0" width="92" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2,2"/>
      <text x="352" y="18" text-anchor="middle" font-size="10.5px" font-weight="600" fill="#94a3b8">Exp 4~8</text>
      <text x="352" y="32" text-anchor="middle" font-size="9.5px" fill="#cbd5e1">休眠</text>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(16, 156)">
      <rect width="398" height="108" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="24" class="box-label" fill="#166534">物理收益：解耦知识容量与计算开销</text>
      <text x="14" y="46" font-size="11.5px" fill="#14532d">以 Mixtral 8x7B 为例：</text>
      <text x="14" y="66" class="mono" fill="#15803d">• 物理总参数: ~47B (庞大知识底座)</text>
      <text x="14" y="86" class="mono" fill="#15803d">• 单步激活计算: ~13B FLOPs (小模型速度)</text>
    </g>
  </g>
</svg>
