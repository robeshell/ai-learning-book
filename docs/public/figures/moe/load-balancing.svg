<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .row-title { font-size: 12px; font-weight: 600; }
      .row-desc { font-size: 11px; font-weight: 400; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">MoE 路由退化（Routing Collapse）与负载均衡（Load Balancing）</text>
  <text x="36" y="68" class="subtitle">防止「少数专家过热挤爆、其余专家饥饿冷死」，确保海量参数得到充分训练</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Column: 路由退化 -->
  <g transform="translate(36, 114)">
    <rect width="430" height="236" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="16" y="16" width="105" height="24" rx="4" fill="#ffedd5"/>
    <text x="68" y="32" text-anchor="middle" class="tag" fill="#c2410c">训练病态现象</text>
    <text x="132" y="33" class="col-title" fill="#9a3412">赢家通吃（Routing Collapse）</text>

    <!-- Point 1 -->
    <g transform="translate(16, 54)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#fed7aa"/>
      <text x="14" y="20" class="row-title" fill="#9a3412">马太效应：少数专家被绝大部分 Token 选中</text>
      <text x="14" y="38" class="row-desc" fill="#7c2d12">Exp 1/2 负载率高达 95%，严重超出专家计算上限（Capacity）</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(16, 112)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#fed7aa"/>
      <text x="14" y="20" class="row-title" fill="#9a3412">其余专家饿死：Exp 3~8 几乎无梯度更新</text>
      <text x="14" y="38" class="row-desc" fill="#7c2d12">47B 庞大参数形同虚设，模型实际退化为一个 13B 稠密小模型</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(16, 172)">
      <rect width="398" height="48" rx="4" fill="#fee2e2"/>
      <text x="14" y="22" class="row-title" fill="#991b1b">恶果：Token 丢弃（Token Dropping）与参数浪费</text>
      <text x="14" y="39" class="row-desc" fill="#dc2626">超出专家容量上限的 Token 被直接跳过计算，损失推理精度</text>
    </g>
  </g>

  <!-- Right Column: 辅助损失约束 -->
  <g transform="translate(494, 114)">
    <rect width="430" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="115" height="24" rx="4" fill="#dcfce7"/>
    <text x="73" y="32" text-anchor="middle" class="tag" fill="#15803d">工业解决方案</text>
    <text x="141" y="33" class="col-title" fill="#166534">辅助负载均衡损失 (Aux Loss)</text>

    <!-- Point 1 -->
    <g transform="translate(16, 54)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="20" class="row-title" fill="#15803d">机制：在训练 Loss 中惩罚分配不均</text>
      <text x="14" y="38" class="mono" fill="#166534">Loss_aux = α · N · Σ (Token比例 f_i × 路由概率 P_i)</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(16, 112)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="20" class="row-title" fill="#15803d">健康均衡分流：所有专家均匀承接 Token 流量</text>
      <text x="14" y="38" class="row-desc" fill="#14532d">每个专家在不同抽象语法特征上充分分工、协同激活</text>
    </g>

    <!-- Result Banner -->
    <g transform="translate(16, 172)">
      <rect width="398" height="48" rx="4" fill="#dcfce7"/>
      <text x="14" y="22" class="row-title" fill="#166534">成效：零 Token 丢弃，充分榨干 47B 参数容量</text>
      <text x="14" y="39" class="row-desc" fill="#15803d">现代 MoE（如 DeepSeek-V3）更演进为共享专家与无损路由</text>
    </g>
  </g>
</svg>
