<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">提示词软约束 vs 约束解码硬约束机制对比</text>
  <text x="36" y="68" class="subtitle">软提示词脆弱引导 vs 硬语法状态机确定性约束</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Soft Constraint (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="100" height="22" rx="4" fill="#fee2e2"/>
      <text x="66" y="29" text-anchor="middle" class="tag" fill="#dc2626">提示词软约束</text>
      <text x="126" y="30" class="col-title" fill="#991b1b">Prompt 礼貌叮嘱（概率性失效）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">提示词乞求方式：</text>
        <text x="12" y="38" class="mono" fill="#7f1d1d">"请只输出合法 JSON，不要废话！"</text>
        <text x="12" y="54" class="box-desc" fill="#991b1b">• 仍可能输出前置解释与 Markdown 标记</text>
        <text x="12" y="70" class="box-desc" fill="#991b1b">• 尾部漏逗号、括号不闭合导致 JSON.parse 崩溃</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">工业工程隐患：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 需要写大量复杂的正则（Regex）与重试逻辑垫底</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 长尾极端输入下，解析成功率难以达到 99.9%</text>
      </g>
    </g>

    <!-- Right: Hard Constraint (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="16" y="14" width="100" height="22" rx="4" fill="#dcfce7"/>
      <text x="66" y="29" text-anchor="middle" class="tag" fill="#16a34a">约束解码硬约束</text>
      <text x="126" y="30" class="col-title" fill="#166534">Grammar 语法树引导（100% 确定性）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="20" class="box-label" fill="#166534">采样层数学拦截机制：</text>
        <text x="12" y="38" class="mono" fill="#14532d">• 将 Pydantic / JSON Schema 编译为有限状态机</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 在 Token 采样瞬间，强行将所有非法词概率置为 0</text>
        <text x="12" y="70" class="mono-bold" fill="#15803d">➔ 物理上杜绝了生成任何语法错误字符的可能！</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">核心工程价值：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 100% 确保下游微服务直接通过反序列化解析</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 消除无意义前导废话，节省推理 Token 与首字延迟</text>
      </g>
    </g>

  </g>
</svg>
