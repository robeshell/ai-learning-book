<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">上下文隔离与结构化 Handoff 严密交接契约</text>
  <text x="36" y="68" class="subtitle">主控上下文隔离、子智能体派发与状态聚合</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Subagent Isolation (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#e2e8f0"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#475569">独立子进程沙箱</text>
      <text x="136" y="30" class="col-title" fill="#0f172a">子 Agent（执行繁重排查）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="20" class="box-label" fill="#0f172a">吃掉 500 次工具调用的海量噪声：</text>
        <text x="12" y="38" class="mono" fill="#475569">• 扫描了 200 个源码文件与 Git 日志</text>
        <text x="12" y="54" class="mono" fill="#475569">• 消耗了 120k 上下文 Token 的试错噪音</text>
        <text x="12" y="70" class="mono-bold" fill="#0f172a">➔ 任务结束，子窗口日志当场释放</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#f1f5f9"/>
        <text x="12" y="20" class="box-label" fill="#334155">Handoff 交付契约：</text>
        <text x="12" y="38" class="mono-bold" fill="#2563eb">• 仅返回结构化 JSON 摘要结论</text>
        <text x="12" y="54" class="box-desc" fill="#64748b">• "缺陷确认在 auth.py:42 行，由于缺少 Token 校验"</text>
      </g>
    </g>

    <!-- Right: Clean Supervisor (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dbeafe"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">纯净全局主控</text>
      <text x="136" y="30" class="col-title" fill="#1e40af">Supervisor（维持极简高阶视野）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">零污染的高阶决策中枢：</text>
        <text x="12" y="38" class="mono" fill="#1d4ed8">• 主控窗口仅保留当前核心步骤与交付物</text>
        <text x="12" y="54" class="mono" fill="#1d4ed8">• 上下文占用始终维持在 5k~10k 纯净区间</text>
        <text x="12" y="70" class="mono-bold" fill="#2563eb">➔ 保持 100% 的注意力敏锐度与逻辑判断力</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">派发下一个专业子 Agent：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 派发 Coder Agent：以纯净结论为输入直接修代码</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 彻底阻断幻觉级联与上下文无限膨胀</text>
      </g>
    </g>

  </g>
</svg>
