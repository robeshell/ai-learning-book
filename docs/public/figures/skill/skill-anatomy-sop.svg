<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 10.5px; font-weight: 400; line-height: 1.35; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Skill 专业技能包解剖：从单句咒语到结构化作业法</text>
  <text x="36" y="68" class="subtitle">封装作业规程（SOP）、执行脚本、行业规范与专用工具，形成自包含的高效复用单元</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 4 Component Grid -->
  <g transform="translate(36, 114)">

    <!-- Comp 1: Instructions (Width: 205) -->
    <g transform="translate(0, 0)">
      <rect width="200" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#dbeafe"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#1d4ed8">核心大脑</text>
      <text x="12" y="52" class="col-title" fill="#1e40af">Instructions 作业规程</text>

      <g transform="translate(12, 66)">
        <rect width="176" height="154" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="18" class="box-label" fill="#1e40af">结构化 SOP 步骤：</text>
        <text x="8" y="36" class="box-desc" fill="#1e3a8a">• 步骤 1: 扫描改动文件</text>
        <text x="8" y="52" class="box-desc" fill="#1e3a8a">• 步骤 2: 运行测试与 Lint</text>
        <text x="8" y="68" class="box-desc" fill="#1e3a8a">• 步骤 3: 提取 Commit 规范</text>
        <text x="8" y="84" class="box-desc" fill="#1e3a8a">• 步骤 4: 生成原子化提交</text>
        <text x="8" y="110" class="mono-bold" fill="#2563eb">➔ 拒绝口播随机发挥</text>
        <text x="8" y="130" class="box-desc" fill="#64748b">严格落实工程确定性流程</text>
      </g>
    </g>

    <!-- Comp 2: Scripts (Width: 205) -->
    <g transform="translate(226, 0)">
      <rect width="200" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#dcfce7"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#16a34a">执行辅助</text>
      <text x="12" y="52" class="col-title" fill="#166534">Scripts 动态脚本</text>

      <g transform="translate(12, 66)">
        <rect width="176" height="154" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="8" y="18" class="box-label" fill="#166534">确定性代码逻辑：</text>
        <text x="8" y="38" class="mono" fill="#15803d">• run_verify.sh</text>
        <text x="8" y="54" class="mono" fill="#15803d">• parse_coverage.py</text>
        <text x="8" y="74" class="box-desc" fill="#14532d">• 复杂计算由脚本搞定</text>
        <text x="8" y="90" class="box-desc" fill="#14532d">• 零 Token 消耗与零算术幻觉</text>
        <text x="8" y="116" class="mono-bold" fill="#16a34a">➔ 模型仅需调用脚本</text>
      </g>
    </g>

    <!-- Comp 3: Resources (Width: 205) -->
    <g transform="translate(452, 0)">
      <rect width="200" height="236" rx="6" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#fae8ff"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#c026d3">静态依据</text>
      <text x="12" y="52" class="col-title" fill="#86198f">Reference 规范标准</text>

      <g transform="translate(12, 66)">
        <rect width="176" height="154" rx="4" fill="#ffffff" stroke="#f5d0fe"/>
        <text x="8" y="18" class="box-label" fill="#86198f">行业标准与参考资料：</text>
        <text x="8" y="38" class="mono" fill="#a21caf">• commit-rules.md</text>
        <text x="8" y="54" class="mono" fill="#a21caf">• security-check.json</text>
        <text x="8" y="74" class="box-desc" fill="#701a75">• 静态知识包自包含</text>
        <text x="8" y="90" class="box-desc" fill="#701a75">• 仅在激活时按需加载</text>
        <text x="8" y="116" class="mono-bold" fill="#86198f">➔ 节省常驻窗口占用</text>
      </g>
    </g>

    <!-- Comp 4: Tools (Width: 205) -->
    <g transform="translate(678, 0)">
      <rect width="205" height="236" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#fef3c7"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#d97706">接口绑定</text>
      <text x="12" y="52" class="col-title" fill="#92400e">Tools 专用工具集</text>

      <g transform="translate(12, 66)">
        <rect width="181" height="154" rx="4" fill="#ffffff" stroke="#fde68a"/>
        <text x="8" y="18" class="box-label" fill="#92400e">预绑定的 MCP / 外部能力：</text>
        <text x="8" y="38" class="mono" fill="#b45309">• git_commit()</text>
        <text x="8" y="54" class="mono" fill="#b45309">• create_pr()</text>
        <text x="8" y="74" class="box-desc" fill="#78350f">• 限制最小权限范围</text>
        <text x="8" y="90" class="box-desc" fill="#78350f">• 针对任务专属定制</text>
        <text x="8" y="116" class="mono-bold" fill="#92400e">➔ 即装即用的专业能力</text>
      </g>
    </g>

  </g>
</svg>
