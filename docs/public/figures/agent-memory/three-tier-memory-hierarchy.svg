<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 10.5px; font-weight: 400; line-height: 1.35; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">AI 智能体的三层记忆分级架构</text>
  <text x="36" y="68" class="subtitle">解耦瞬时工作台、短期会话状态与长期跨任务知识库，攻克上下文窗口物理上限</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 3 Tier Grid -->
  <g transform="translate(36, 114)">

    <!-- Tier 1: Working Memory (Width: 280) -->
    <g transform="translate(0, 0)">
      <rect width="280" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#dbeafe"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">第 1 层：瞬时</text>
      <text x="104" y="30" class="col-title" fill="#1e40af">工作记忆（Working Memory）</text>

      <g transform="translate(14, 48)">
        <rect width="252" height="96" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">物理介质：上下文窗口 (RAM)</text>
        <text x="10" y="38" class="mono" fill="#1d4ed8">• 当前轮次的 Prompt 与回复</text>
        <text x="10" y="54" class="mono" fill="#1d4ed8">• 正在执行的 Tool Observation</text>
        <text x="10" y="72" class="box-desc" fill="#1e3a8a">• 毫秒级全量 Self-Attention</text>
        <text x="10" y="88" class="box-desc" fill="#1e3a8a">• 随单次推理结束即行销毁</text>
      </g>

      <g transform="translate(14, 154)">
        <rect width="252" height="66" rx="4" fill="#dbeafe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">工程边界：</text>
        <text x="10" y="38" class="box-desc" fill="#1e3a8a">• 严禁把所有历史无限塞入</text>
        <text x="10" y="54" class="box-desc" fill="#1e3a8a">• 需由 Harness 定期裁剪</text>
      </g>
    </g>

    <!-- Tier 2: Short-term Session State (Width: 280) -->
    <g transform="translate(304, 0)">
      <rect width="280" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#dcfce7"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#16a34a">第 2 层：局部</text>
      <text x="104" y="30" class="col-title" fill="#166534">会话状态（Session State）</text>

      <g transform="translate(14, 48)">
        <rect width="252" height="96" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="10" y="20" class="box-label" fill="#166534">物理介质：宿主内存 / SQLite</text>
        <text x="10" y="38" class="mono" fill="#15803d">• 任务待办清单 (Scratchpad)</text>
        <text x="10" y="54" class="mono" fill="#15803d">• Checkpoint 执行步骤历史</text>
        <text x="10" y="72" class="box-desc" fill="#14532d">• 支撑多轮任务状态一致性</text>
        <text x="10" y="88" class="box-desc" fill="#14532d">• 支持故障断点续传与回滚</text>
      </g>

      <g transform="translate(14, 154)">
        <rect width="252" height="66" rx="4" fill="#dcfce7"/>
        <text x="10" y="20" class="box-label" fill="#166534">工程价值：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 维持长任务连续性</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• 任务完成时归档或清空</text>
      </g>
    </g>

    <!-- Tier 3: Long-term Persistent Memory (Width: 280) -->
    <g transform="translate(608, 0)">
      <rect width="280" height="236" rx="6" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#fae8ff"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#c026d3">第 3 层：永久</text>
      <text x="104" y="30" class="col-title" fill="#86198f">长期记忆（Long-term Store）</text>

      <g transform="translate(14, 48)">
        <rect width="252" height="96" rx="4" fill="#ffffff" stroke="#f5d0fe"/>
        <text x="10" y="20" class="box-label" fill="#86198f">物理介质：向量库 / 磁盘文件</text>
        <text x="10" y="38" class="mono" fill="#a21caf">• 用户长期偏好与项目规则</text>
        <text x="10" y="54" class="mono" fill="#a21caf">• 跨任务沉淀的经验与教训</text>
        <text x="10" y="72" class="box-desc" fill="#701a75">• 跨会话永久持久化存储</text>
        <text x="10" y="88" class="box-desc" fill="#701a75">• 按需通过 Embedding 语义唤回</text>
      </g>

      <g transform="translate(14, 154)">
        <rect width="252" height="66" rx="4" fill="#fae8ff"/>
        <text x="10" y="20" class="box-label" fill="#86198f">风险防范：</text>
        <text x="10" y="38" class="box-desc" fill="#701a75">• 需设计 TTL 与失效淘汰机制</text>
        <text x="10" y="54" class="box-desc" fill="#701a75">• 避免过期过时经验误导决策</text>
      </g>
    </g>

  </g>
</svg>
