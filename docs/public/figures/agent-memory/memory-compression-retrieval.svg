<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 10.5px; font-weight: 400; line-height: 1.35; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">记忆生命周期：上下文压缩、沉淀归档与动态唤回</text>
  <text x="36" y="68" class="subtitle">上下文压缩摘要、持久化归档与语义唤回</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Pipeline 4 Stages -->
  <g transform="translate(36, 114)">

    <!-- Stage 1: Window Overflow (Width: 205) -->
    <g transform="translate(0, 0)">
      <rect width="200" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#fee2e2"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#dc2626">触发点</text>
      <text x="12" y="52" class="col-title" fill="#991b1b">工作窗口超限预警</text>

      <g transform="translate(12, 66)">
        <rect width="176" height="154" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="8" y="18" class="box-label" fill="#991b1b">窗口占用达到 85%：</text>
        <text x="8" y="36" class="box-desc" fill="#7f1d1d">• 多轮调试历史累积</text>
        <text x="8" y="52" class="box-desc" fill="#7f1d1d">• 工具吐出海量细节日志</text>
        <text x="8" y="70" class="mono" fill="#b91c1c">Token: 175k / 200k</text>
        <text x="8" y="92" class="box-desc" fill="#7f1d1d">• 注意力开始涣散</text>
        <text x="8" y="108" class="box-desc" fill="#7f1d1d">• 面临上下文溢出风险</text>
        <text x="8" y="132" class="mono-bold" fill="#dc2626">➔ 触发 Harness 压缩</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(206, 110)">
      <path d="M0,8 L14,8 M10,4 L14,8 L10,12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Stage 2: Compaction (Width: 205) -->
    <g transform="translate(226, 0)">
      <rect width="200" height="236" rx="6" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#fae8ff"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#c026d3">压缩提炼</text>
      <text x="12" y="52" class="col-title" fill="#86198f">滚动摘要与状态剪枝</text>

      <g transform="translate(12, 66)">
        <rect width="176" height="154" rx="4" fill="#ffffff" stroke="#f5d0fe"/>
        <text x="8" y="18" class="box-label" fill="#86198f">结构化提炼核心事实：</text>
        <text x="8" y="38" class="mono" fill="#a21caf">• 丢弃已解决的试错报错</text>
        <text x="8" y="54" class="mono" fill="#a21caf">• 提炼“已修改 auth.py”</text>
        <text x="8" y="70" class="mono" fill="#a21caf">• 保留当前待办 Todo</text>
        <text x="8" y="94" class="box-desc" fill="#701a75">• 窗口体积回落至 30k</text>
        <text x="8" y="110" class="box-desc" fill="#701a75">• 释放 70% 宝贵空间</text>
        <text x="8" y="132" class="mono-bold" fill="#86198f">➔ 恢复推理注意力敏锐度</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(432, 110)">
      <path d="M0,8 L14,8 M10,4 L14,8 L10,12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Stage 3: Long-term Store (Width: 205) -->
    <g transform="translate(452, 0)">
      <rect width="200" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#dbeafe"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#1d4ed8">经验沉淀</text>
      <text x="12" y="52" class="col-title" fill="#1e40af">长期记忆沉淀归档</text>

      <g transform="translate(12, 66)">
        <rect width="176" height="154" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="18" class="box-label" fill="#1e40af">跨会话经验向量化：</text>
        <text x="8" y="38" class="mono" fill="#1d4ed8">• 沉淀经验: "该项目用 uv"</text>
        <text x="8" y="54" class="mono" fill="#1d4ed8">• 偏好: "用户喜欢中文注释"</text>
        <text x="8" y="78" class="box-desc" fill="#1e3a8a">• 写入本地 memory.md</text>
        <text x="8" y="94" class="box-desc" fill="#1e3a8a">• 构建持久化向量索引</text>
        <text x="8" y="120" class="mono-bold" fill="#2563eb">➔ 永久保留高阶智慧</text>
      </g>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(658, 110)">
      <path d="M0,8 L14,8 M10,4 L14,8 L10,12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Stage 4: Semantic Recall (Width: 205) -->
    <g transform="translate(678, 0)">
      <rect width="205" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#dcfce7"/>
      <text x="47" y="26" text-anchor="middle" class="tag" fill="#16a34a">动态唤回</text>
      <text x="12" y="52" class="col-title" fill="#166534">新任务语义检索注入</text>

      <g transform="translate(12, 66)">
        <rect width="181" height="154" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="8" y="18" class="box-label" fill="#166534">下一任务秒级唤醒：</text>
        <text x="8" y="38" class="mono" fill="#15803d">• 用户启动新会话任务</text>
        <text x="8" y="54" class="mono" fill="#15803d">• 检索到历史项目经验</text>
        <text x="8" y="78" class="box-desc" fill="#14532d">• 自动沿用包管理工具</text>
        <text x="8" y="94" class="box-desc" fill="#14532d">• 无需人类反复强调规则</text>
        <text x="8" y="122" class="mono-bold" fill="#16a34a">➔ 越用越懂你的默契</text>
      </g>
    </g>

  </g>
</svg>
