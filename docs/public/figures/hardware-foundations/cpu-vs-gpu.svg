<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    </style>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">CPU（大学教授） vs GPU（一万名小学生）：计算拓扑的物理本质</text>
  <text x="36" y="68" class="subtitle">大模型本质是超大规模的矩阵乘法，需要极致的并发吞吐而非复杂的单核分支逻辑</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Column: CPU -->
  <g transform="translate(36, 114)">
    <rect width="430" height="280" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="105" height="24" rx="4" fill="#e2e8f0"/>
    <text x="68" y="32" text-anchor="middle" class="tag" fill="#334155">串行核心</text>
    <text x="132" y="33" class="col-title" fill="#0f172a">CPU 架构（几个全能教授）</text>

    <!-- Cores Visual -->
    <g transform="translate(16, 54)">
      <rect width="398" height="64" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="12" y="12" width="86" height="40" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="55" y="36" text-anchor="middle" font-size="11px" font-weight="700" fill="#3730a3">Core 1 (强悍)</text>
      <rect x="108" y="12" width="86" height="40" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="151" y="36" text-anchor="middle" font-size="11px" font-weight="700" fill="#3730a3">Core 2</text>
      <rect x="204" y="12" width="86" height="40" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="247" y="36" text-anchor="middle" font-size="11px" font-weight="700" fill="#3730a3">Core 3</text>
      <rect x="300" y="12" width="86" height="40" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
      <text x="343" y="36" text-anchor="middle" font-size="11px" font-weight="700" fill="#3730a3">Core 4</text>
    </g>

    <g transform="translate(16, 128)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="14" y="20" class="box-label" fill="#0f172a">核心优势：复杂逻辑与指令调度</text>
      <text x="14" y="38" class="box-desc" fill="#64748b">单核主频高达 5GHz，擅长 if-else 分支跳转与操作系统管理。</text>
    </g>

    <g transform="translate(16, 188)">
      <rect width="398" height="76" rx="4" fill="#fee2e2"/>
      <text x="14" y="22" class="box-label" fill="#991b1b">在 AI 场景下的瓶颈：</text>
      <text x="14" y="42" class="box-desc" fill="#7f1d1d">• 核心数太少（通常 8~64 核），无法同时计算数亿次乘法</text>
      <text x="14" y="62" class="box-desc" fill="#7f1d1d">• 算一个千亿大模型矩阵点积需要排队数小时</text>
    </g>
  </g>

  <!-- Right Column: GPU -->
  <g transform="translate(494, 114)">
    <rect width="430" height="280" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="16" y="16" width="105" height="24" rx="4" fill="#dcfce7"/>
    <text x="68" y="32" text-anchor="middle" class="tag" fill="#15803d">海量并行</text>
    <text x="132" y="33" class="col-title" fill="#166534">GPU 架构（上万名小学生）</text>

    <!-- Cores Visual Grid -->
    <g transform="translate(16, 54)">
      <rect width="398" height="64" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <!-- Grid of mini ALUs -->
      <g fill="#dcfce7" stroke="#86efac">
        <rect x="14" y="10" width="20" height="18" rx="2"/><rect x="38" y="10" width="20" height="18" rx="2"/>
        <rect x="62" y="10" width="20" height="18" rx="2"/><rect x="86" y="10" width="20" height="18" rx="2"/>
        <rect x="110" y="10" width="20" height="18" rx="2"/><rect x="134" y="10" width="20" height="18" rx="2"/>
        <rect x="158" y="10" width="20" height="18" rx="2"/><rect x="182" y="10" width="20" height="18" rx="2"/>
        <rect x="206" y="10" width="20" height="18" rx="2"/><rect x="230" y="10" width="20" height="18" rx="2"/>
        <rect x="254" y="10" width="20" height="18" rx="2"/><rect x="278" y="10" width="20" height="18" rx="2"/>
        <rect x="302" y="10" width="20" height="18" rx="2"/><rect x="326" y="10" width="20" height="18" rx="2"/>
        <rect x="350" y="10" width="34" height="18" rx="2"/>

        <rect x="14" y="34" width="20" height="18" rx="2"/><rect x="38" y="34" width="20" height="18" rx="2"/>
        <rect x="62" y="34" width="20" height="18" rx="2"/><rect x="86" y="34" width="20" height="18" rx="2"/>
        <rect x="110" y="34" width="20" height="18" rx="2"/><rect x="134" y="34" width="20" height="18" rx="2"/>
        <rect x="158" y="34" width="20" height="18" rx="2"/><rect x="182" y="34" width="20" height="18" rx="2"/>
        <rect x="206" y="34" width="20" height="18" rx="2"/><rect x="230" y="34" width="20" height="18" rx="2"/>
        <rect x="254" y="34" width="20" height="18" rx="2"/><rect x="278" y="34" width="20" height="18" rx="2"/>
        <rect x="302" y="34" width="20" height="18" rx="2"/><rect x="326" y="34" width="20" height="18" rx="2"/>
        <rect x="350" y="34" width="34" height="18" rx="2"/>
      </g>
      <text x="367" y="47" text-anchor="middle" font-size="9px" font-weight="700" fill="#15803d">16384核</text>
    </g>

    <g transform="translate(16, 128)">
      <rect width="398" height="50" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="20" class="box-label" fill="#166534">核心优势：海量并发乘加运算（$y=wx+b$）</text>
      <text x="14" y="38" class="box-desc" fill="#15803d">虽然每个核心只会算简单算术，但能在 1 个时钟周期同时算出上万个结果。</text>
    </g>

    <g transform="translate(16, 188)">
      <rect width="398" height="76" rx="4" fill="#dcfce7"/>
      <text x="14" y="22" class="box-label" fill="#166534">在 AI 场景下的绝对统治力：</text>
      <text x="14" y="42" class="box-desc" fill="#14532d">• 矩阵乘法（GEMM）天然可以完全摊平在万核上并发计算</text>
      <text x="14" y="62" class="box-desc" fill="#14532d">• 让数万亿次浮点运算在毫秒级内瞬间吞吐完成</text>
    </g>
  </g>
</svg>
