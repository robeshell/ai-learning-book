<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .cell-head { font-size: 12px; font-weight: 700; fill: #475569; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
      .highlight { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; fill: #2563eb; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">数值精度（Precision）与显存换算对照矩阵</text>
  <text x="36" y="68" class="subtitle">公式：静态权重显存 (GB) = 模型参数量 (Billion) × 每参数物理字节数 (Bytes)</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Table Container -->
  <g transform="translate(36, 114)">
    <rect width="888" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Table Header Row -->
    <rect x="0" y="0" width="888" height="42" rx="6" fill="#f1f5f9"/>
    <text x="80" y="26" text-anchor="middle" class="cell-head">模型规模</text>
    <text x="245" y="26" text-anchor="middle" class="cell-head">FP32 (4 字节/单精度)</text>
    <text x="430" y="26" text-anchor="middle" class="cell-head">FP16 / BF16 (2 字节/标准)</text>
    <text x="615" y="26" text-anchor="middle" class="cell-head">INT8 (1 字节/量化)</text>
    <text x="795" y="26" text-anchor="middle" class="cell-head">INT4 (0.5 字节/极限量化)</text>
    <line x1="0" y1="42" x2="888" y2="42" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Row 1: 7B -->
    <g transform="translate(0, 42)">
      <rect width="888" height="46" fill="#ffffff"/>
      <text x="80" y="28" text-anchor="middle" class="mono" font-weight="700" fill="#0f172a">7B 模型</text>
      <text x="245" y="28" text-anchor="middle" class="mono" fill="#64748b">28 GB</text>
      <text x="430" y="28" text-anchor="middle" class="highlight">14 GB (主流标准)</text>
      <text x="615" y="28" text-anchor="middle" class="mono" fill="#16a34a">7 GB</text>
      <text x="795" y="28" text-anchor="middle" class="mono" fill="#16a34a">3.5 GB (手机可跑)</text>
      <line x1="0" y1="46" x2="888" y2="46" stroke="#e2e8f0"/>
    </g>

    <!-- Row 2: 14B -->
    <g transform="translate(0, 88)">
      <rect width="888" height="46" fill="#f8fafc"/>
      <text x="80" y="28" text-anchor="middle" class="mono" font-weight="700" fill="#0f172a">14B 模型</text>
      <text x="245" y="28" text-anchor="middle" class="mono" fill="#64748b">56 GB</text>
      <text x="430" y="28" text-anchor="middle" class="highlight">28 GB (需 32G 卡)</text>
      <text x="615" y="28" text-anchor="middle" class="mono" fill="#16a34a">14 GB (4090 可跑)</text>
      <text x="795" y="28" text-anchor="middle" class="mono" fill="#16a34a">7 GB</text>
      <line x1="0" y1="46" x2="888" y2="46" stroke="#e2e8f0"/>
    </g>

    <!-- Row 3: 70B -->
    <g transform="translate(0, 134)">
      <rect width="888" height="46" fill="#ffffff"/>
      <text x="80" y="28" text-anchor="middle" class="mono" font-weight="700" fill="#0f172a">70B 模型</text>
      <text x="245" y="28" text-anchor="middle" class="mono" fill="#64748b">280 GB</text>
      <text x="430" y="28" text-anchor="middle" class="highlight">140 GB (需 2×80G 卡)</text>
      <text x="615" y="28" text-anchor="middle" class="mono" fill="#2563eb">70 GB (单卡 A100)</text>
      <text x="795" y="28" text-anchor="middle" class="mono" fill="#16a34a">35 GB (双 4090)</text>
      <line x1="0" y1="46" x2="888" y2="46" stroke="#e2e8f0"/>
    </g>

    <!-- Row 4: 671B (DeepSeek-V3 MoE) -->
    <g transform="translate(0, 180)">
      <rect width="888" height="56" rx="6" fill="#f8fafc"/>
      <text x="80" y="32" text-anchor="middle" class="mono" font-weight="700" fill="#0f172a">671B (MoE)</text>
      <text x="245" y="32" text-anchor="middle" class="mono" fill="#64748b">2684 GB</text>
      <text x="430" y="32" text-anchor="middle" class="mono" fill="#64748b">1342 GB</text>
      <text x="615" y="32" text-anchor="middle" class="highlight">671 GB (FP8 工业标准)</text>
      <text x="795" y="32" text-anchor="middle" class="mono" fill="#16a34a">335 GB</text>
    </g>
  </g>
</svg>
