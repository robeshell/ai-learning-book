<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">升维与降维：高维特征分离与低维信息瓶颈</text>
  <text x="36" y="68" class="subtitle">升维展开特征空间，降维提炼核心瓶颈</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 2-Column Grid -->
  <g transform="translate(36, 114)">

    <!-- Left Column: Up-Projection (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dbeafe"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">升维投影</text>
      <text x="116" y="30" class="col-title" fill="#1e40af">升维（d_in &lt; d_out）：展开线性可分空间</text>

      <!-- Graphic -->
      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <!-- 1D/2D Entangled Points -->
        <g transform="translate(20, 20)">
          <text x="0" y="12" class="mono" fill="#64748b">2D 低维纠缠（不可分）</text>
          <circle cx="20" cy="35" r="5" fill="#ef4444"/>
          <circle cx="45" cy="42" r="5" fill="#3b82f6"/>
          <circle cx="30" cy="55" r="5" fill="#ef4444"/>
          <circle cx="55" cy="25" r="5" fill="#3b82f6"/>
        </g>
        <!-- Arrow -->
        <line x1="150" y1="48" x2="195" y2="48" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <text x="172" y="38" text-anchor="middle" font-size="10px" fill="#2563eb">W_up</text>
        <!-- 3D/HD Separated Points -->
        <g transform="translate(215, 12)">
          <text x="0" y="12" class="mono" fill="#1e40af">高维超平面完美切分</text>
          <path d="M 10 58 L 140 25" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="30" cy="25" r="5" fill="#ef4444"/>
          <circle cx="65" cy="18" r="5" fill="#ef4444"/>
          <circle cx="85" cy="55" r="5" fill="#3b82f6"/>
          <circle cx="120" cy="48" r="5" fill="#3b82f6"/>
          <text x="145" y="42" font-size="9px" fill="#059669">切分面</text>
        </g>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">高维特征映射：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 展开低维纠缠，提供线性可分空间</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 配合非线性激活拟合复杂决策边界</text>
        <text x="12" y="70" class="mono-bold" fill="#1d4ed8">➔ 升维本质：复杂特征高维展开</text>
      </g>
    </g>

    <!-- Right Column: Down-Projection (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#dcfce7"/>
      <text x="61" y="29" text-anchor="middle" class="tag" fill="#15803d">降维投影</text>
      <text x="116" y="30" class="col-title" fill="#166534">降维（d_in &gt; d_out）：提炼核心信息瓶颈</text>

      <!-- Graphic -->
      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <!-- HD Vector -->
        <g transform="translate(20, 20)">
          <text x="0" y="12" class="mono" fill="#64748b">高维向量 [d=4096]</text>
          <rect x="0" y="24" width="120" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
          <text x="60" y="39" text-anchor="middle" class="mono" fill="#475569">[0.2, -1.5, ..., 0.8]</text>
        </g>
        <!-- Arrow -->
        <line x1="160" y1="48" x2="205" y2="48" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <text x="182" y="38" text-anchor="middle" font-size="10px" fill="#059669">W_down</text>
        <!-- LD Bottleneck -->
        <g transform="translate(225, 20)">
          <text x="0" y="12" class="mono" fill="#166534">紧凑表征 [d=128]</text>
          <rect x="0" y="24" width="135" height="22" rx="3" fill="#dcfce7" stroke="#86efac"/>
          <text x="67" y="39" text-anchor="middle" class="mono-bold" fill="#15803d">[0.9, -0.4, ...]</text>
        </g>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">特征降维与压缩：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 过滤冗余噪声，提炼本质表征</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 低秩投影在紧凑维度保留核心信息</text>
        <text x="12" y="70" class="mono-bold" fill="#15803d">➔ 降维本质：构建信息瓶颈消除干扰</text>
      </g>
    </g>

  </g>
</svg>
