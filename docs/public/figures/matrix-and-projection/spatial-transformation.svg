<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">矩阵变换几何本质：网格变形、空间旋转与拉伸</text>
  <text x="36" y="68" class="subtitle">矩阵相乘本质是标准基底坐标系的空间线性变换</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Canvas -->
  <g transform="translate(36, 114)">

    <!-- Left: Original Space (Width: 360) -->
    <g transform="translate(0, 0)">
      <rect width="360" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#e2e8f0"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#475569">原始空间</text>
      <text x="104" y="30" class="col-title" fill="#0f172a">标准正交基底 (x)</text>

      <!-- Mini Coordinate Grid (Origin at x=40, y=170) -->
      <g transform="translate(20, 50)">
        <rect width="320" height="116" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- Grid lines -->
        <path d="M 40 20 L 40 100 M 90 20 L 90 100 M 140 20 L 140 100 M 190 20 L 190 100 M 240 20 L 240 100" stroke="#f1f5f9" stroke-width="1"/>
        <path d="M 20 40 L 300 40 M 20 70 L 300 70 M 20 100 L 300 100" stroke="#f1f5f9" stroke-width="1"/>
        <!-- Axes -->
        <line x1="40" y1="100" x2="280" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <line x1="40" y1="100" x2="40" y2="20" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
        <!-- Basis Vector i -->
        <line x1="40" y1="100" x2="100" y2="100" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
        <text x="105" y="96" class="mono-bold" fill="#2563eb">i [1,0]</text>
        <!-- Basis Vector j -->
        <line x1="40" y1="100" x2="40" y2="40" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
        <text x="46" y="38" class="mono-bold" fill="#059669">j [0,1]</text>
        <!-- Sample Vector v -->
        <line x1="40" y1="100" x2="160" y2="40" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
        <text x="166" y="38" class="mono-bold" fill="#7c3aed">v [2,1]</text>
      </g>

      <g transform="translate(20, 176)">
        <text x="0" y="18" class="box-desc" fill="#475569">• 单位正方形未发生形变，面积为 1.0</text>
        <text x="0" y="36" class="box-desc" fill="#475569">• 向量 v 为基底线性组合：v = 2i + 1j</text>
      </g>
    </g>

    <!-- Center: Transformation Matrix (Width: 160) -->
    <g transform="translate(376, 0)">
      <rect width="148" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="74" y="32" text-anchor="middle" class="tag" fill="#1d4ed8">权重矩阵 W</text>

      <!-- Matrix Box -->
      <g transform="translate(14, 50)">
        <rect width="120" height="90" rx="4" fill="#ffffff" stroke="#93c5fd"/>
        <text x="60" y="26" text-anchor="middle" class="mono-bold" fill="#1e40af">| 1.5 -0.5 |</text>
        <text x="60" y="48" text-anchor="middle" class="mono-bold" fill="#1e40af">| 0.5  1.2 |</text>
        <line x1="12" y1="62" x2="108" y2="62" stroke="#e2e8f0" stroke-width="1"/>
        <text x="60" y="78" text-anchor="middle" font-size="10px" fill="#3b82f6">旋转 + 缩放算子</text>
      </g>

      <g transform="translate(14, 150)">
        <text x="60" y="18" text-anchor="middle" class="box-label" fill="#1e40af">矩阵的物理意义</text>
        <text x="10" y="38" class="box-desc" fill="#1e3a8a">• 不是静态数据表</text>
        <text x="10" y="56" class="box-desc" fill="#1e3a8a">• 是空间扭曲动态力场</text>
      </g>
    </g>

    <!-- Right: Transformed Space (Width: 360) -->
    <g transform="translate(540, 0)">
      <rect width="348" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#dcfce7"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#15803d">变换空间</text>
      <text x="104" y="30" class="col-title" fill="#166534">扭曲后的新基底 (y = Wx)</text>

      <!-- Mini Coordinate Grid (Transformed) -->
      <g transform="translate(20, 50)">
        <rect width="308" height="116" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <!-- Axes -->
        <line x1="40" y1="95" x2="270" y2="95" stroke="#cbd5e1" stroke-width="1"/>
        <line x1="40" y1="95" x2="40" y2="15" stroke="#cbd5e1" stroke-width="1"/>
        <!-- Transformed Basis Vector Wi [1.5, 0.5] -->
        <line x1="40" y1="95" x2="130" y2="65" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
        <text x="135" y="65" class="mono-bold" fill="#2563eb">Wi [1.5, 0.5]</text>
        <!-- Transformed Basis Vector Wj [-0.5, 1.2] -->
        <line x1="40" y1="95" x2="10" y2="25" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
        <text x="16" y="20" class="mono-bold" fill="#059669">Wj [-0.5, 1.2]</text>
        <!-- Transformed Vector Wv = 2Wi + 1Wj = [2.5, 2.2] -->
        <line x1="40" y1="95" x2="190" y2="25" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
        <text x="196" y="25" class="mono-bold" fill="#7c3aed">y [2.5, 2.2]</text>
      </g>

      <g transform="translate(20, 176)">
        <text x="0" y="18" class="box-desc" fill="#14532d">• 基底倾斜伸长，网格变换为平行四边形</text>
        <text x="0" y="36" class="box-desc" fill="#14532d">• 矩阵相乘给出所有向量在新基底下的坐标</text>
      </g>
    </g>

  </g>
</svg>
