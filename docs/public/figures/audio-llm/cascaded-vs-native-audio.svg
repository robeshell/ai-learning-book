<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">传统级联语音（ASR+LLM+TTS） vs 原生端到端语音架构</text>
  <text x="36" y="68" class="subtitle">级联链路延迟叠加且丢失语气情绪；原生端到端实现毫秒级响应并保留完整声学副语言特征</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Cascaded (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#dc2626">传统级联链路</text>
      <text x="136" y="30" class="col-title" fill="#991b1b">ASR ➔ LLM ➔ TTS 三段拼装</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">处理流程与延迟叠加：</text>
        <text x="12" y="38" class="mono" fill="#7f1d1d">语音输入 ➔ [ASR: 400ms] ➔ 纯文本</text>
        <text x="12" y="54" class="mono" fill="#7f1d1d">➔ [LLM: 800ms] ➔ [TTS: 500ms] ➔ 语音输出</text>
        <text x="12" y="72" class="mono-bold" fill="#dc2626">➔ 总延迟 > 1.7 秒！存在严重机械卡顿感</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">信息损失：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• ASR 将哭腔、叹气、语调起伏强制拍平成枯燥字符</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 无法实现流畅的打断与双向重叠交谈（半双工）</text>
      </g>
    </g>

    <!-- Right: Native End-to-End (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dcfce7"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#16a34a">原生端到端语音</text>
      <text x="136" y="30" class="col-title" fill="#166534">Native Audio Codec 统一建模</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="20" class="box-label" fill="#166534">流式音频 Token 统一链路（GPT-4o 路线）：</text>
        <text x="12" y="38" class="mono" fill="#15803d">音频波形 ➔ [Audio Codec] ➔ 声学 Token</text>
        <text x="12" y="54" class="mono" fill="#15803d">➔ [多模态大模型] ➔ 流式输出声学 Token</text>
        <text x="12" y="72" class="mono-bold" fill="#16a34a">➔ 端到端首包延迟 &lt; 300 毫秒！逼近人类直觉</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">核心突破：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 原生感知语速、呼吸声、幽默调侃与情绪起伏</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 支持全双工实时打断与自然话轮切换</text>
      </g>
    </g>

  </g>
</svg>
