<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">半双工回合制 vs 全双工实时打断（Barge-in）交互</text>
  <text x="36" y="68" class="subtitle">全双工系统同时保持上行听音与下行发音；VAD 毫秒级静音与打断机制消除机械等待</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Half-Duplex (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#f1f5f9"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#475569">传统半双工</text>
      <text x="136" y="30" class="col-title" fill="#1e293b">对讲机回合制（我说你听）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="12" y="20" class="box-label" fill="#334155">时序特征：</text>
        <text x="12" y="38" class="mono" fill="#475569">人类说话 ➔ 静音等待 800ms ➔ 触发识别</text>
        <text x="12" y="54" class="mono" fill="#475569">➔ AI 播报中（麦克风闭锁，人类插嘴无效）</text>
        <text x="12" y="72" class="mono-bold" fill="#dc2626">➔ 一旦开始播报，人类必须硬着头皮听完</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#f1f5f9"/>
        <text x="12" y="20" class="box-label" fill="#334155">痛点体验：</text>
        <text x="12" y="38" class="box-desc" fill="#475569">• 必须停顿等待，充满令人尴尬的静音空档</text>
        <text x="12" y="54" class="box-desc" fill="#475569">• 无法像真人交谈一样自然插话、点头或随时打断</text>
      </g>
    </g>

    <!-- Right: Full-Duplex (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dbeafe"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">现代全双工</text>
      <text x="136" y="30" class="col-title" fill="#1e40af">电话式双向流动（实时打断）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">流式持续感知与打断（Barge-in）：</text>
        <text x="12" y="38" class="mono" fill="#1d4ed8">• 麦克风持续流式监听，VAD 实时计算能量与意图</text>
        <text x="12" y="54" class="mono" fill="#1d4ed8">• 人类一旦开口（"等等！"），AI 立即截断当前音频流</text>
        <text x="12" y="72" class="mono-bold" fill="#2563eb">➔ 毫秒级静音切换，无缝进入最新话轮响应</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">工程核心：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 回声消除（AEC）：过滤扬声器声音防止 AI 自己打断自己</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 语义断句：区分用户是真打断还是无意识的语气助词（如"嗯"）</text>
      </g>
    </g>

  </g>
</svg>
