<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .label { font-size: 11.5px; font-weight: 700; }
      .desc { font-size: 11px; fill: #475569; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="38" class="title">注意力架构的工业级演进：从 MHA 到 GQA 与 MLA</text>
  <text x="36" y="68" class="subtitle">MHA、GQA 到 MLA 演进与 KV Cache 压缩</text>
  <line x1="36" y1="80" x2="924" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 3 Columns Comparison -->
  <g transform="translate(36, 100)">

    <!-- 1. MHA (2017 Classic) Width: 275 -->
    <g transform="translate(0, 0)">
      <rect width="275" height="250" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="12" y="12" width="100" height="20" rx="4" fill="#f1f5f9"/>
      <text x="62" y="26" text-anchor="middle" class="tag" fill="#475569">2017 经典基线</text>
      <text x="12" y="52" class="col-title" fill="#1e293b">MHA (多头注意力)</text>

      <g transform="translate(12, 66)">
        <rect width="251" height="168" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
        <!-- Heads visual -->
        <text x="8" y="22" class="label" fill="#334155">Query 头与 KV 比例：1:1</text>
        <text x="8" y="42" class="mono" fill="#475569">• 8 个 Q 头 ➔ 8 组独立的 K, V 头</text>
        <text x="8" y="62" class="mono" fill="#475569">• KV Cache 显存开销：100% (基准)</text>

        <line x1="8" y1="78" x2="243" y2="78" stroke="#f1f5f9" stroke-width="1"/>
        <text x="8" y="98" class="label" fill="#dc2626">长文本致命瓶颈：</text>
        <text x="8" y="118" class="desc">• 128k 上下文下显存爆炸</text>
        <text x="8" y="136" class="desc">• 显存带宽吃满，GPU 严重空转</text>

        <rect x="8" y="146" width="235" height="18" rx="3" fill="#fee2e2"/>
        <text x="125" y="159" text-anchor="middle" class="mono-bold" fill="#dc2626">长文本显存开销极重</text>
      </g>
    </g>

    <!-- 2. GQA (2023-2024 Standard) Width: 275 -->
    <g transform="translate(306, 0)">
      <rect width="275" height="250" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="12" y="12" width="130" height="20" rx="4" fill="#dbeafe"/>
      <text x="77" y="26" text-anchor="middle" class="tag" fill="#1d4ed8">2024 工业标配 (Llama 3)</text>
      <text x="12" y="52" class="col-title" fill="#1e40af">GQA (分组查询注意力)</text>

      <g transform="translate(12, 66)">
        <rect width="251" height="168" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="8" y="22" class="label" fill="#1e40af">Query 头与 KV 比例：8:1 分组共享</text>
        <text x="8" y="42" class="mono" fill="#1d4ed8">• 8 个 Q 头 ➔ 共享 1 组 K, V 头</text>
        <text x="8" y="62" class="mono-bold" fill="#1d4ed8">• KV Cache 显存直接缩减至 12.5%</text>

        <line x1="8" y1="78" x2="243" y2="78" stroke="#eff6ff" stroke-width="1"/>
        <text x="8" y="98" class="label" fill="#2563eb">工程收益与表现：</text>
        <text x="8" y="118" class="desc">• 保持 99%+ 的多头模型生成质量</text>
        <text x="8" y="136" class="desc">• 推理吞吐暴增 4~8 倍</text>

        <rect x="8" y="146" width="235" height="18" rx="3" fill="#dbeafe"/>
        <text x="125" y="159" text-anchor="middle" class="mono-bold" fill="#1d4ed8">主流模型标配 (Llama/Qwen)</text>
      </g>
    </g>

    <!-- 3. MLA (2024-2026 Cutting Edge) Width: 275 -->
    <g transform="translate(612, 0)">
      <rect width="275" height="250" rx="6" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
      <rect x="12" y="12" width="140" height="20" rx="4" fill="#fae8ff"/>
      <text x="82" y="26" text-anchor="middle" class="tag" fill="#c026d3">2025-2026 前沿 (DeepSeek)</text>
      <text x="12" y="52" class="col-title" fill="#86198f">MLA (多头潜变量注意力)</text>

      <g transform="translate(12, 66)">
        <rect width="251" height="168" rx="4" fill="#ffffff" stroke="#f5d0fe"/>
        <text x="8" y="22" class="label" fill="#86198f">低秩联合压缩 (Low-Rank Latent)</text>
        <text x="8" y="42" class="mono" fill="#a21caf">• K, V 联合压缩为一个低维潜变量</text>
        <text x="8" y="62" class="mono-bold" fill="#a21caf">• KV Cache 显存暴降 90% 以上</text>

        <line x1="8" y1="78" x2="243" y2="78" stroke="#fdf4ff" stroke-width="1"/>
        <text x="8" y="98" class="label" fill="#c026d3">终极架构优势：</text>
        <text x="8" y="118" class="desc">• 显存极小，却拥有完整 MHA 表达力</text>
        <text x="8" y="136" class="desc">• 兼顾长文本与极高吞吐并发</text>

        <rect x="8" y="146" width="235" height="18" rx="3" fill="#fae8ff"/>
        <text x="125" y="159" text-anchor="middle" class="mono-bold" fill="#86198f">前沿架构杀手锏 (DeepSeek-V3)</text>
      </g>
    </g>

  </g>
</svg>
