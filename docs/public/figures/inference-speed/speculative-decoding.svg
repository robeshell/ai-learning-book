<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .step-title { font-size: 13.5px; font-weight: 700; }
      .step-desc { font-size: 11px; font-weight: 400; fill: #64748b; }
      .token-box { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; }
      .badge { font-size: 10.5px; font-weight: 600; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">推测采样（Speculative Decoding）起草与验证流水线</text>
  <text x="36" y="68" class="subtitle">小模型自回归推测与大模型单步并行校验</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Pipeline Body -->
  <g transform="translate(36, 112)">
    <!-- Step 1: Draft Model (Small) -->
    <g transform="translate(0, 0)">
      <rect width="888" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="16" y="14" width="112" height="22" rx="3" fill="#e2e8f0"/>
      <text x="72" y="29" text-anchor="middle" class="badge" fill="#334155">阶段 1：小模型起草</text>
      <text x="138" y="30" class="step-title" fill="#0f172a">草稿模型 (1B) 快速推测 K=4 候选词</text>

      <g transform="translate(16, 44)">
        <rect x="0" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="55" y="18" text-anchor="middle" class="token-box" fill="#1e40af">Token 1: "人工"</text>

        <rect x="120" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="175" y="18" text-anchor="middle" class="token-box" fill="#1e40af">Token 2: "智能"</text>

        <rect x="240" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="295" y="18" text-anchor="middle" class="token-box" fill="#1e40af">Token 3: "的"</text>

        <rect x="360" y="0" width="110" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="415" y="18" text-anchor="middle" class="token-box" fill="#1e40af">Token 4: "本质"</text>

        <text x="490" y="18" class="step-desc">参数极小，生成仅耗时数毫秒</text>
      </g>
    </g>

    <!-- Downward Arrow -->
    <path d="M 444 86 L 444 100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step 2: Target Model (Large) Parallel Forward -->
    <g transform="translate(0, 106)">
      <rect width="888" height="82" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="112" height="22" rx="3" fill="#dbeafe"/>
      <text x="72" y="29" text-anchor="middle" class="badge" fill="#1d4ed8">阶段 2：大模型核验</text>
      <text x="138" y="30" class="step-title" fill="#1e40af">Target Model (70B) 单次并行前向计算所有候选位置打分</text>

      <g transform="translate(16, 44)">
        <rect width="520" height="28" rx="4" fill="#ffffff" stroke="#93c5fd"/>
        <text x="16" y="18" font-size="11px" font-weight="600" fill="#1e40af">大模型单次前向并行校验 4 个候选位置概率</text>
        <text x="550" y="18" class="step-desc">💡 充分吃满 GPU 算力，拒绝 4 次串行读取权重</text>
      </g>
    </g>

    <!-- Downward Arrow -->
    <path d="M 444 192 L 444 206" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step 3: Rejection Sampling & Output -->
    <g transform="translate(0, 212)">
      <rect width="888" height="86" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="16" y="14" width="124" height="22" rx="3" fill="#dcfce7"/>
      <text x="78" y="29" text-anchor="middle" class="badge" fill="#15803d">阶段 3：拒绝采样裁决</text>
      <text x="150" y="30" class="step-title" fill="#166534">按概率比值判定：通过前 3 个词，修正第 4 个词</text>

      <g transform="translate(16, 44)">
        <rect x="0" y="0" width="120" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
        <text x="60" y="20" text-anchor="middle" class="token-box" fill="#15803d">✓ 接收: "人工"</text>

        <rect x="130" y="0" width="120" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
        <text x="190" y="20" text-anchor="middle" class="token-box" fill="#15803d">✓ 接收: "智能"</text>

        <rect x="260" y="0" width="120" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
        <text x="320" y="20" text-anchor="middle" class="token-box" fill="#15803d">✓ 接收: "的"</text>

        <rect x="390" y="0" width="130" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
        <text x="455" y="20" text-anchor="middle" class="token-box" fill="#dc2626">✗ 拒绝并重采样</text>

        <rect x="530" y="0" width="150" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="605" y="20" text-anchor="middle" class="token-box" fill="#1e40af">🎯 修正为: "物理机制"</text>
      </g>
    </g>
  </g>
</svg>
