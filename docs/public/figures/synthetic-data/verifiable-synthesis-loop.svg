<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <marker id="syn-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">可验证领域的合成数据闭环：从模型生成到外部编译器判题</text>
  <text x="36" y="68" class="subtitle">在代码与数学等客观可验证领域，通过外部真实环境反馈剔除幻觉，沉淀 100% 高保真训练语料</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 4-Step Pipeline -->
  <g transform="translate(36, 114)">

    <!-- Step 1: Prompt & Generation -->
    <g transform="translate(0, 0)">
      <rect width="210" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#e2e8f0"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#475569">第 1 步</text>
      <text x="92" y="30" class="col-title" fill="#0f172a">海量自造题目</text>

      <g transform="translate(14, 48)">
        <rect width="182" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="20" class="box-label" fill="#0f172a">多样性题目派生：</text>
        <text x="10" y="38" class="box-desc" fill="#64748b">• 种子指令变异（Evol）</text>
        <text x="10" y="54" class="box-desc" fill="#64748b">• 随机组合边界约束条件</text>
        <text x="10" y="70" class="box-desc" fill="#64748b">• 批量出题（数百万道）</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="182" height="78" rx="4" fill="#f1f5f9"/>
        <text x="10" y="20" class="box-label" fill="#334155">生成候选解：</text>
        <text x="10" y="38" class="box-desc" fill="#64748b">• 采样温度 T=0.8 探索</text>
        <text x="10" y="54" class="box-desc" fill="#64748b">• 每道题生成 N 个解答分支</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <path d="M 218 118 L 232 118" stroke="#3b82f6" stroke-width="2" marker-end="url(#syn-arrow)"/>

    <!-- Step 2: Sandbox / Compiler Execution -->
    <g transform="translate(240, 0)">
      <rect width="215" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#dbeafe"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">第 2 步</text>
      <text x="92" y="30" class="col-title" fill="#1e40af">外部沙箱执行</text>

      <g transform="translate(14, 48)">
        <rect width="187" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">真实执行器验证：</text>
        <text x="10" y="38" class="mono" fill="#1e3a8a">• Python / C++ 编译运行</text>
        <text x="10" y="54" class="mono" fill="#1e3a8a">• 单元测试（Unit Tests）</text>
        <text x="10" y="70" class="mono" fill="#1e3a8a">• 形式化证明（Lean 4）</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="187" height="78" rx="4" fill="#fee2e2"/>
        <text x="10" y="20" class="box-label" fill="#991b1b">无情自动筛选：</text>
        <text x="10" y="38" class="box-desc" fill="#7f1d1d">• 语法错误 ➔ 立即丢弃</text>
        <text x="10" y="54" class="box-desc" fill="#7f1d1d">• 用例报错 ➔ 立即丢弃</text>
        <text x="10" y="70" class="box-desc" fill="#7f1d1d">• 超时死循环 ➔ 立即丢弃</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <path d="M 463 118 L 477 118" stroke="#3b82f6" stroke-width="2" marker-end="url(#syn-arrow)"/>

    <!-- Step 3: Verified Dataset -->
    <g transform="translate(485, 0)">
      <rect width="210" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#dcfce7"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#15803d">第 3 步</text>
      <text x="92" y="30" class="col-title" fill="#166534">高质数据沉淀</text>

      <g transform="translate(14, 48)">
        <rect width="182" height="84" rx="4" fill="#ffffff" stroke="#86efac"/>
        <text x="10" y="20" class="box-label" fill="#166534">100% 可验证样本：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 包含完整思考过程</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• 经过全部测试用例检验</text>
        <text x="10" y="70" class="box-desc" fill="#14532d">• 格式严谨、无执行幻觉</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="182" height="78" rx="4" fill="#dcfce7"/>
        <text x="10" y="20" class="box-label" fill="#166534">去重与平衡：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 剔除同质化解法</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• 保证各领域难度均衡</text>
      </g>
    </g>

    <!-- Arrow 3 -->
    <path d="M 703 118 L 717 118" stroke="#3b82f6" stroke-width="2" marker-end="url(#syn-arrow)"/>

    <!-- Step 4: Model Flywheel -->
    <g transform="translate(725, 0)">
      <rect width="163" height="236" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#fef3c7"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#92400e">第 4 步</text>
      <text x="92" y="30" class="col-title" fill="#92400e">能力飞轮</text>

      <g transform="translate(14, 48)">
        <rect width="135" height="84" rx="4" fill="#ffffff" stroke="#fcd34d"/>
        <text x="10" y="20" class="box-label" fill="#92400e">迭代训练：</text>
        <text x="10" y="38" class="box-desc" fill="#78350f">• 训练更强模型</text>
        <text x="10" y="54" class="box-desc" fill="#78350f">• 解题成功率提升</text>
        <text x="10" y="70" class="box-desc" fill="#78350f">• 出题难度再升级</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="135" height="78" rx="4" fill="#fef3c7"/>
        <text x="10" y="20" class="box-label" fill="#92400e">飞轮启动：</text>
        <text x="10" y="40" class="mono-bold" fill="#b45309">AI 强化自造</text>
        <text x="10" y="58" class="box-desc" fill="#92400e">突破人类语料墙</text>
      </g>
    </g>

  </g>
</svg>
