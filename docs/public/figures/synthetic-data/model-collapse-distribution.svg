<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">模型崩溃（Model Collapse）：递归无监督自吞食的不可逆退化</text>
  <text x="36" y="68" class="subtitle">Nature 2024 研究表明：若模型无节制地吞食上一代模型生成的未验证数据，长尾罕见知识将彻底消失</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 3-Column Progression -->
  <g transform="translate(36, 114)">

    <!-- Gen 0: Original Human Distribution -->
    <g transform="translate(0, 0)">
      <rect width="284" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#dcfce7"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#15803d">第 0 代 (基准)</text>
      <text x="104" y="30" class="col-title" fill="#166534">原始人类数据分布</text>

      <g transform="translate(14, 48)">
        <rect width="256" height="84" rx="4" fill="#ffffff" stroke="#86efac"/>
        <text x="10" y="20" class="box-label" fill="#166534">高斯分布宽阔丰满：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 包含海量头部常见常识</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• 包含丰富的长尾罕见细节</text>
        <text x="10" y="72" class="mono-bold" fill="#15803d">➔ 语言多样性丰富、信息熵极高</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="256" height="78" rx="4" fill="#dcfce7"/>
        <text x="10" y="20" class="box-label" fill="#166534">知识状态：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 覆盖罕见历史事件与小众代码</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• 表达方式极其多姿多彩</text>
      </g>
    </g>

    <!-- Gen 2-3: Early Collapse -->
    <g transform="translate(302, 0)">
      <rect width="284" height="236" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#fef3c7"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#92400e">第 2~3 代</text>
      <text x="104" y="30" class="col-title" fill="#92400e">早期方差收敛与坍缩</text>

      <g transform="translate(14, 48)">
        <rect width="256" height="84" rx="4" fill="#ffffff" stroke="#fcd34d"/>
        <text x="10" y="20" class="box-label" fill="#92400e">长尾信息被裁切：</text>
        <text x="10" y="38" class="box-desc" fill="#78350f">• 模型倾向输出高概率安全词</text>
        <text x="10" y="54" class="box-desc" fill="#78350f">• 低频真实信息被当成噪声抹除</text>
        <text x="10" y="72" class="mono-bold" fill="#b45309">➔ 生成内容逐渐套路化、同质化</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="256" height="78" rx="4" fill="#fef3c7"/>
        <text x="10" y="20" class="box-label" fill="#92400e">早期征兆：</text>
        <text x="10" y="38" class="box-desc" fill="#78350f">• 语言风格单一刻板</text>
        <text x="10" y="54" class="box-desc" fill="#78350f">• 复杂逻辑长链条开始断裂</text>
      </g>
    </g>

    <!-- Gen 5+: Late Collapse -->
    <g transform="translate(604, 0)">
      <rect width="284" height="236" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#fee2e2"/>
      <text x="54" y="29" text-anchor="middle" class="tag" fill="#b91c1c">第 5 代以后</text>
      <text x="104" y="30" class="col-title" fill="#991b1b">晚期完全崩溃（坍缩为尖峰）</text>

      <g transform="translate(14, 48)">
        <rect width="256" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="10" y="20" class="box-label" fill="#991b1b">不可逆的数据灾难：</text>
        <text x="10" y="38" class="box-desc" fill="#7f1d1d">• 分布坍缩为一个无意义窄尖峰</text>
        <text x="10" y="54" class="box-desc" fill="#7f1d1d">• 模型陷入无休止胡言乱语与复读</text>
        <text x="10" y="72" class="mono-bold" fill="#dc2626">➔ 原始人类知识分布彻底丢失！</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="256" height="78" rx="4" fill="#fee2e2"/>
        <text x="10" y="20" class="box-label" fill="#991b1b">破局关键：</text>
        <text x="10" y="38" class="box-desc" fill="#7f1d1d">• 必须引入客观环境判题器验证</text>
        <text x="10" y="54" class="box-desc" fill="#7f1d1d">• 保留高质量真实人类原始语料</text>
      </g>
    </g>

  </g>
</svg>
