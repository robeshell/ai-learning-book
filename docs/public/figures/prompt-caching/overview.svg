<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14.5px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 600; }
      .box-desc { font-size: 11px; font-weight: 400; }
      .metric-val { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">无状态重算 vs 前缀缓存（Prompt Caching）前向推理对比</text>
  <text x="36" y="68" class="subtitle">前缀状态缓存与计算开销对比</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Column: 传统无状态全量重算 -->
  <g transform="translate(36, 114)">
    <rect width="430" height="280" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="16" y="16" width="112" height="24" rx="4" fill="#ffedd5"/>
    <text x="72" y="32" text-anchor="middle" class="tag" fill="#c2410c">传统模式：无缓存</text>
    <text x="138" y="33" class="col-title" fill="#9a3412">每轮全量重复 Prefill</text>

    <!-- Step 1 -->
    <g transform="translate(16, 52)">
      <rect width="398" height="52" rx="4" fill="#ffffff" stroke="#fed7aa"/>
      <text x="14" y="22" class="box-label" fill="#9a3412">输入：System (2k) + 历史 (6k) + 新问题</text>
      <text x="14" y="40" class="box-desc" fill="#7c2d12">8,000+ Tokens 全部重复送入 GPU</text>
    </g>

    <!-- Arrow -->
    <path d="M 215 110 L 215 120" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(16, 126)">
      <rect width="398" height="60" rx="4" fill="#ffffff" stroke="#fed7aa"/>
      <text x="14" y="22" class="box-label" fill="#9a3412">GPU 计算：从第 1 个 Token 开始算 QKV</text>
      <text x="14" y="40" class="box-desc" fill="#7c2d12">自注意力计算量 O(N²)，显存带宽与算力被重复吃满</text>
      <text x="14" y="54" class="box-desc" fill="#ea580c">首字延迟（TTFT）随历史长度急剧拉长</text>
    </g>

    <!-- Result Row -->
    <g transform="translate(16, 202)">
      <rect width="398" height="62" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="14" y="24" class="box-label" fill="#991b1b">物理开销指标</text>
      <text x="14" y="46" class="metric-val" fill="#dc2626">TTFT: ~2800ms  |  计费: 100% 全价</text>
    </g>
  </g>

  <!-- Right Column: 前缀缓存模式 -->
  <g transform="translate(494, 114)">
    <rect width="430" height="280" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="124" height="24" rx="4" fill="#dcfce7"/>
    <text x="78" y="32" text-anchor="middle" class="tag" fill="#15803d">优化模式：前缀命中</text>
    <text x="150" y="33" class="col-title" fill="#166534">复用已有 KV Cache</text>

    <!-- Step 1 -->
    <g transform="translate(16, 52)">
      <rect width="398" height="52" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="22" class="box-label" fill="#166534">匹配前缀哈希：命中已有 8,000 Tokens</text>
      <text x="14" y="40" class="box-desc" fill="#14532d">直接从显存/内存定位现成的 Key-Value 激活值</text>
    </g>

    <!-- Arrow -->
    <path d="M 215 110 L 215 120" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <!-- Step 2 -->
    <g transform="translate(16, 126)">
      <rect width="398" height="60" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="14" y="22" class="box-label" fill="#166534">GPU 计算：仅对增量 New Token 做计算</text>
      <text x="14" y="40" class="box-desc" fill="#14532d">前 8000 字 0 FLOPs 计算，仅计算新输入的 50 字</text>
      <text x="14" y="54" class="box-desc" fill="#15803d">计算量断崖式下降，首字瞬间吐出</text>
    </g>

    <!-- Result Row -->
    <g transform="translate(16, 202)">
      <rect width="398" height="62" rx="4" fill="#dcfce7" stroke="#86efac"/>
      <text x="14" y="24" class="box-label" fill="#166534">物理开销指标</text>
      <text x="14" y="46" class="metric-val" fill="#15803d">TTFT: ~150ms (快 18x) | 计费: 降 50%~90%</text>
    </g>
  </g>
</svg>
