<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">长文本认知陷阱：迷失在中间（Lost in the Middle）U 型曲线</text>
  <text x="36" y="68" class="subtitle">首因与近因效应下的 U 型关键事实召回曲线</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: U-Curve Visual Chart (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="16" y="14" width="120" height="22" rx="4" fill="#f1f5f9"/>
      <text x="76" y="29" text-anchor="middle" class="tag" fill="#475569">召回准确率实测</text>
      <text x="146" y="30" class="col-title" fill="#1e293b">位置分布与提取准确率</text>

      <!-- Chart Axes & Curve -->
      <g transform="translate(36, 60)">
        <!-- Y Axis -->
        <line x1="30" y1="10" x2="30" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="22" y="18" text-anchor="end" class="mono" fill="#64748b">100%</text>
        <text x="22" y="70" text-anchor="end" class="mono" fill="#64748b">50%</text>
        <text x="22" y="130" text-anchor="end" class="mono" fill="#64748b">0%</text>

        <!-- X Axis -->
        <line x1="30" y1="130" x2="360" y2="130" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="30" y="148" text-anchor="start" class="mono" fill="#64748b">0% (开头)</text>
        <text x="195" y="148" text-anchor="middle" class="mono" fill="#dc2626">50% (正文中间)</text>
        <text x="360" y="148" text-anchor="end" class="mono" fill="#64748b">100% (结尾)</text>

        <!-- U-Curve Path -->
        <path d="M40,24 C90,30 140,110 195,112 C250,110 300,35 350,28" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

        <!-- Points -->
        <circle cx="40" cy="24" r="4" fill="#2563eb"/>
        <text x="45" y="18" class="mono-bold" fill="#2563eb">94% (首部)</text>

        <circle cx="195" cy="112" r="5" fill="#dc2626"/>
        <text x="195" y="100" text-anchor="middle" class="mono-bold" fill="#dc2626">48% 迷失盲区！</text>

        <circle cx="350" cy="28" r="4" fill="#16a34a"/>
        <text x="345" y="20" text-anchor="end" class="mono-bold" fill="#16a34a">91% (尾部)</text>
      </g>
    </g>

    <!-- Right: Engineering Insights (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#dc2626">工程本质与启示</text>
      <text x="136" y="30" class="col-title" fill="#991b1b">标称窗口 ≠ 有效工作记忆</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">认知衰减三大根源：</text>
        <text x="12" y="38" class="mono" fill="#7f1d1d">1. 首因效应: 初始指令拥有高先验权重</text>
        <text x="12" y="54" class="mono" fill="#7f1d1d">2. 近因效应: 邻近 Query 处于注意力焦距内</text>
        <text x="12" y="72" class="mono-bold" fill="#dc2626">3. 中间稀释: 庞大的背景噪声冲淡了中间 Token 权重</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">架构选型原则：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 不要把 50 万字资料无脑全塞进上下文窗口</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 关键事实前置或后置；高精度问答仍需依靠精准 RAG</text>
      </g>
    </g>

  </g>
</svg>
