<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Softmax 归一化在超长文本下的注意力稀释（Attention Dilution）</text>
  <text x="36" y="68" class="subtitle">随着 Token 数量从 1k 暴涨至 128k+，海量无关背景噪声分摊总概率，导致关键线索的注意力被严重冲淡</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Short Context (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dbeafe"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">短文本场景 (2k)</text>
      <text x="136" y="30" class="col-title" fill="#1e40af">高聚焦、低熵注意力分布</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">Softmax 概率归一化分布：</text>
        <text x="12" y="38" class="mono" fill="#1d4ed8">关键事实 Token:  [██████████████] 78.4%</text>
        <text x="12" y="54" class="mono" fill="#64748b">背景无关 Token:  [▎             ] 21.6% (平摊)</text>
        <text x="12" y="72" class="mono-bold" fill="#2563eb">➔ 注意力极度尖锐集中，精准命中目标线索</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">表现特征：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 逻辑严密、多跳推理稳定、指令遵循度高</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 上下文各处事实均能高胜率提取</text>
      </g>
    </g>

    <!-- Right: Ultra Long Context (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
      <rect x="16" y="14" width="120" height="22" rx="4" fill="#fae8ff"/>
      <text x="76" y="29" text-anchor="middle" class="tag" fill="#c026d3">超长文本场景 (128k+)</text>
      <text x="146" y="30" class="col-title" fill="#86198f">高熵弥散、注意力退化</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#f5d0fe"/>
        <text x="12" y="20" class="box-label" fill="#86198f">海量噪声累积效应：</text>
        <text x="12" y="38" class="mono" fill="#a21caf">关键事实 Token:  [██            ] 12.1% (暴跌)</text>
        <text x="12" y="54" class="mono" fill="#701a75">10万无关 Token:  [████████████  ] 87.9% (噪声总和)</text>
        <text x="12" y="72" class="mono-bold" fill="#c026d3">➔ 关键线索淹没在噪声汪洋中，发生认知退化（Rot）</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fae8ff"/>
        <text x="12" y="20" class="box-label" fill="#86198f">后果表现：</text>
        <text x="12" y="38" class="box-desc" fill="#701a75">• 复杂多跳推理中断、指令逐渐被遗忘忽视</text>
        <text x="12" y="54" class="box-desc" fill="#701a75">• 模型倾向于用固有先验进行概率胡说（幻觉飙升）</text>
      </g>
    </g>

  </g>
</svg>
