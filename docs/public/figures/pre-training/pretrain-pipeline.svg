<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 600; }
      .box-label { font-size: 12px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">预训练语料清洗流水线：从万亿原始网页到纯净 Token 流</text>
  <text x="36" y="68" class="subtitle">海量语料清洗、分词与自回归训练流水线</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 4-Stage Pipeline Flow -->
  <g transform="translate(36, 114)">

    <!-- Stage 1: Raw Web Data -->
    <g transform="translate(0, 0)">
      <rect width="205" height="236" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#e2e8f0"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#475569">第 1 阶段</text>
      <text x="92" y="30" class="col-title" fill="#0f172a">原始语料采集</text>

      <g transform="translate(14, 48)">
        <rect width="177" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="20" class="box-label" fill="#0f172a">数据源（数十 TB）：</text>
        <text x="10" y="38" class="box-desc" fill="#64748b">• Common Crawl 网页</text>
        <text x="10" y="54" class="box-desc" fill="#64748b">• GitHub 开源代码</text>
        <text x="10" y="70" class="box-desc" fill="#64748b">• 维基百科、学术论文</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="177" height="78" rx="4" fill="#fee2e2"/>
        <text x="10" y="20" class="box-label" fill="#991b1b">原始缺陷：</text>
        <text x="10" y="38" class="box-desc" fill="#7f1d1d">• HTML 模板垃圾</text>
        <text x="10" y="54" class="box-desc" fill="#7f1d1d">• 色情广告、机器人刷量</text>
        <text x="10" y="70" class="box-desc" fill="#7f1d1d">• 个人敏感隐私（PII）</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <path d="M 213 118 L 227 118" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: Quality & Dedup Filtering -->
    <g transform="translate(235, 0)">
      <rect width="215" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#dbeafe"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">第 2 阶段</text>
      <text x="92" y="30" class="col-title" fill="#1e40af">过滤与去重</text>

      <g transform="translate(14, 48)">
        <rect width="187" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">启发式过滤规则：</text>
        <text x="10" y="38" class="box-desc" fill="#1e3a8a">• 停用词比例与字符分布</text>
        <text x="10" y="54" class="box-desc" fill="#1e3a8a">• FastText 语种分类器</text>
        <text x="10" y="70" class="box-desc" fill="#1e3a8a">• 正则脱敏手机号与身份证</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="187" height="78" rx="4" fill="#dbeafe"/>
        <text x="10" y="20" class="box-label" fill="#1e40af">全局 MinHash 去重：</text>
        <text x="10" y="38" class="box-desc" fill="#1e3a8a">• 剔除 80% 重复模板网页</text>
        <text x="10" y="54" class="box-desc" fill="#1e3a8a">• 防止模型对重复段死记硬背</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <path d="M 458 118 L 472 118" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 3: Tokenization & Packaging -->
    <g transform="translate(480, 0)">
      <rect width="205" height="236" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#dcfce7"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#15803d">第 3 阶段</text>
      <text x="92" y="30" class="col-title" fill="#166534">分词与打包</text>

      <g transform="translate(14, 48)">
        <rect width="177" height="84" rx="4" fill="#ffffff" stroke="#86efac"/>
        <text x="10" y="20" class="box-label" fill="#166534">BPE 字节分词：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 字符串转整数 Token ID</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• 词表大小 32K ~ 128K</text>
        <text x="10" y="70" class="box-desc" fill="#14532d">• 插入 &lt;s&gt;、&lt;/s&gt; 边界标记</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="177" height="78" rx="4" fill="#dcfce7"/>
        <text x="10" y="20" class="box-label" fill="#166534">定长拼接与打包：</text>
        <text x="10" y="38" class="box-desc" fill="#14532d">• 多篇短文拼成 4K/8K 块</text>
        <text x="10" y="54" class="box-desc" fill="#14532d">• Document Mask 隔离注意力</text>
      </g>
    </g>

    <!-- Arrow 3 -->
    <path d="M 693 118 L 707 118" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 4: Cluster Pretraining -->
    <g transform="translate(715, 0)">
      <rect width="173" height="236" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="22" rx="4" fill="#fef3c7"/>
      <text x="49" y="29" text-anchor="middle" class="tag" fill="#92400e">第 4 阶段</text>
      <text x="92" y="30" class="col-title" fill="#92400e">分布式训练</text>

      <g transform="translate(14, 48)">
        <rect width="145" height="84" rx="4" fill="#ffffff" stroke="#fcd34d"/>
        <text x="10" y="20" class="box-label" fill="#92400e">万卡并行算力：</text>
        <text x="10" y="38" class="mono" fill="#78350f">TP / PP / DP 并行</text>
        <text x="10" y="54" class="mono" fill="#78350f">ZeRO-3 显存优化</text>
        <text x="10" y="70" class="mono" fill="#78350f">AdamW 优化器迭代</text>
      </g>

      <g transform="translate(14, 142)">
        <rect width="145" height="78" rx="4" fill="#fef3c7"/>
        <text x="10" y="20" class="box-label" fill="#92400e">最终产出：</text>
        <text x="10" y="40" class="mono-bold" fill="#b45309">Base 基座模型</text>
        <text x="10" y="58" class="box-desc" fill="#92400e">（百亿级稠密权重）</text>
      </g>
    </g>

  </g>
</svg>
