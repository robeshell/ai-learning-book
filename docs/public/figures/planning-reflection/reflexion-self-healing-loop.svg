<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 11px; font-weight: 400; line-height: 1.4; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Reflexion 自我反思与可验证反馈自愈闭环</text>
  <text x="36" y="68" class="subtitle">环境反馈观测、根因反思与自愈迭代</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: Verifiable Domain (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#dcfce7"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#16a34a">客观可验证领域</text>
      <text x="136" y="30" class="col-title" fill="#166534">代码/数学（高胜率自愈）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="12" y="20" class="box-label" fill="#166534">拥有确凿的物理裁判：</text>
        <text x="12" y="38" class="mono" fill="#15803d">• 编译器报错: "SyntaxError at line 14"</text>
        <text x="12" y="54" class="mono" fill="#15803d">• 单元测试: "Assert expected 200, got 404"</text>
        <text x="12" y="72" class="mono-bold" fill="#16a34a">➔ 反思明确知道“错在哪里”，自愈纠偏极快！</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dcfce7"/>
        <text x="12" y="20" class="box-label" fill="#166534">工程规律：</text>
        <text x="12" y="38" class="box-desc" fill="#14532d">• 反馈越确定、越微观，自我修复成功率越高</text>
        <text x="12" y="54" class="box-desc" fill="#14532d">• 3~5 轮自愈即可收敛到 100% 正确率</text>
      </g>
    </g>

    <!-- Right: Non-Verifiable Domain (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="71" y="29" text-anchor="middle" class="tag" fill="#dc2626">主观不可验证领域</text>
      <text x="136" y="30" class="col-title" fill="#991b1b">文案/审美（空转自嗨陷阱）</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">缺乏客观标准裁判：</text>
        <text x="12" y="38" class="mono" fill="#7f1d1d">• "这篇文案是否足够优美吸引人？"</text>
        <text x="12" y="54" class="mono" fill="#7f1d1d">• 模型自己给自己挑刺 ➔ 越改越平庸</text>
        <text x="12" y="72" class="mono-bold" fill="#dc2626">➔ 没有外部裁判，反思会陷入无限空转！</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">防范策略：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 严禁在主观领域启用无上限反思循环</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 必须引入人类打分或硬编码单次交付</text>
      </g>
    </g>

  </g>
</svg>
