<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
      .col-title { font-size: 13.5px; font-weight: 700; }
      .tag { font-size: 10.5px; font-weight: 600; }
      .box-label { font-size: 11.5px; font-weight: 700; }
      .box-desc { font-size: 10.5px; font-weight: 400; line-height: 1.35; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
      .mono-bold { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text x="36" y="44" class="title">从 M×N 网状胶水到 M+N 标准协议：MCP 的架构演进</text>
  <text x="36" y="68" class="subtitle">如同 USB-C 统一硬件接口、LSP 统一编程语言支持，MCP 彻底终结了大模型与上下文工具的碎片化适配</text>
  <line x1="36" y1="92" x2="924" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Main Grid -->
  <g transform="translate(36, 114)">

    <!-- Left: M x N Chaos (Width: 426) -->
    <g transform="translate(0, 0)">
      <rect width="426" height="236" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
      <rect x="16" y="14" width="100" height="22" rx="4" fill="#fee2e2"/>
      <text x="66" y="29" text-anchor="middle" class="tag" fill="#dc2626">传统碎片化</text>
      <text x="126" y="30" class="col-title" fill="#991b1b">M × N 混乱网状依赖</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#fecaca"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">高昂的胶水代码维护成本：</text>
        <text x="12" y="38" class="mono" fill="#7f1d1d">• M 个客户端（Claude, Cursor, 各种 Agent 框架）</text>
        <text x="12" y="54" class="mono" fill="#7f1d1d">• N 个数据源（GitHub, Postgres, Slack, Jira, Notion）</text>
        <text x="12" y="72" class="box-desc" fill="#991b1b">➔ 每个客户端必须针对每个工具单独编写一套适配解析器！</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#fee2e2"/>
        <text x="12" y="20" class="box-label" fill="#991b1b">核心痛点：</text>
        <text x="12" y="38" class="box-desc" fill="#7f1d1d">• 工具一旦更新 API，所有客户端胶水代码全部失效</text>
        <text x="12" y="54" class="box-desc" fill="#7f1d1d">• 生态严重割裂，重复造轮子且安全标准参差不齐</text>
      </g>
    </g>

    <!-- Right: M + N MCP Protocol (Width: 426) -->
    <g transform="translate(462, 0)">
      <rect width="426" height="236" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <rect x="16" y="14" width="100" height="22" rx="4" fill="#dbeafe"/>
      <text x="66" y="29" text-anchor="middle" class="tag" fill="#1d4ed8">MCP 开放标准</text>
      <text x="126" y="30" class="col-title" fill="#1e40af">M + N 统一协议总线架构</text>

      <g transform="translate(16, 48)">
        <rect width="394" height="84" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">标准化标准总线通信（JSON-RPC 2.0）：</text>
        <text x="12" y="38" class="mono" fill="#1d4ed8">• 任何工具只需封装一个标准的 MCP Server</text>
        <text x="12" y="54" class="mono" fill="#1d4ed8">• 任何客户端只需实现通用的 MCP Client</text>
        <text x="12" y="72" class="mono-bold" fill="#2563eb">➔ 一次编写，全生态即插即用（Plug and Play）</text>
      </g>

      <g transform="translate(16, 142)">
        <rect width="394" height="78" rx="4" fill="#dbeafe"/>
        <text x="12" y="20" class="box-label" fill="#1e40af">工程收益：</text>
        <text x="12" y="38" class="box-desc" fill="#1e3a8a">• 支持本地子进程（Stdio）与远程服务（SSE / HTTP）</text>
        <text x="12" y="54" class="box-desc" fill="#1e3a8a">• 规范化权限隔离与能力发现，构建开放工具生态</text>
      </g>
    </g>

  </g>
</svg>
